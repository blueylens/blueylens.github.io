   "html": {
    "zh": "<h2>一句話判斷 Bottom line [OPINION]<\/h2>\n<p>The server bucket got bigger, and more of Microsoft's building bucket moved into operating leases that sit outside capex. Microsoft's CPU/GPU share rose to about three-quarters while its reported capex came in about $5B under its own guide, which Microsoft puts down to late third-party capacity. It now sees calendar 2026 at about $170B.<\/p>\n<p>伺服器這一塊變大了；微軟的機房支出有更多轉進不計入資本支出的營業租賃。微軟 CPU/GPU 等短期資產占比升到約四分之三，帳上資本支出則比自家指引少約 50 億美元，微軟說原因是第三方算力交付延後；2026 年預估降到約 1,700 億美元。<\/p>",

msft-ex99_1.htm\">FY26 Q4 release<\/a>, cash flow statement, \"Additions to property and equipment\" $(35,802)M<\/td>\n<\/tr>\n<tr>\n<td>Microsoft FY27 Q2 capex outlook<\/td>\n<td style=\"text-align: right;\">\"over $50 billion\"<\/td>\n<td style=\"text-align: right;\">—<\/td>\n<td>FY27 Q2 outlook deck, slide 3<\/td>\n<\/tr>\n<tr>\n<td>Microsoft calendar-2026 capex<\/td>\n<td style=\"text-align: right;\">~$170B, \"due to the 3P capacity delays\" (<a target=\"_blank\" rel=\"noopener\" href=\"https://aka.ms/transcriptfy27q1\">FY27 Q1 transcript<\/a>)<\/td>\n<td style=\"text-align: right;\">~$175B (July); ~$190B (April)<\/td>\n<td>Latest: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.microsoft.com/en-us/investor/events/fy-2027/earnings-fy-2027-q1\">FY27 Q1 earnings call<\/a>; prior: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q4\">FY26 Q4 call<\/a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q3\">FY26 Q3 call<\/a><\/td>\n<\/tr>\n<tr>\n<td>Azure growth<\/td>\n<td style=\"text-align: right;\">+48% (cc +48%)<\/td>\n<td style=\"text-align: right;\">+43% (FY26 Q4); guide ~45% cc<\/td>\n<td>release<\/td>\n<\/tr>\n<tr>\n<td>Azure FY27 Q2 guide<\/td>\n<td style=\"text-align: right;\">+49% to +50% cc<\/td>\n<td style=\"text-align: right;\">—<\/td>\n<td>outlook deck, slide 4<\/td>\n<\/tr>\n<tr>\n<td>Microsoft Cloud revenue<\/td>\n<td style=\"text-align: right;\">$63.9B, +30%<\/td>\n<td style=\"text-align: right;\">$59.3B, +27%<\/td>\n<td>release<\/td>\n<\/tr>\n<tr>\n<td>Commercial RPO<\/td>\n<td style=\"text-align: right;\">$677B, +73%<\/td>\n<td style=\"text-align: right;\">$678B, +84%<\/td>\n<td>release<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>[ESTIMATE] Our math 估算:<\/strong> Microsoft short-lived assets ≈ 3/4 × $45.2B ≈ $34B in FY27 Q1, up from ≈ 2/3 × $41.0B ≈ $27B in FY26 Q4. The rest (long-lived) ≈ $1     "zh": "<h2>會計 The accounting<\/h2>\n<p><strong>[FACT]<\/strong> On its Jul 29 call, Microsoft said that from FY27 it extends datacenter and office-building lives \"from 15 to 25 years,\" and that \"more of our future datacenter leases will shift from finance leases to operating leases ... Finance leases are included in capital expenditures while operating leases are not. Outside of this useful life impact, our calendar year 2026 CapEx investment expectations remain unchanged.\" That moved its calendar-2026 figure to \"approximately $175 billion\" (<a target=\"_blank\" rel=\"noopener\" href=\"https://aka.ms/transcriptfy26q4\">FY26 Q4 transcript<\/a>). In April it had said \"roughly $190 billion\" (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q3\">FY26 Q3 call<\/a>).<\/p>\n<p><strong>[FACT]<\/strong> The FY27 Q1 10-Q (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/789019/000119312526436133/msft-20260930.htm\">Note 12, Leases<\/a>) shows the shift: right-of-use assets obtained for operating leases were $6.5B in the quarter, vs $1.4B a year earlier and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm\">$4.6B for all of FY26<\/a>. Finance-lease additions fell to $5.2B from $9.1B. Leases signed but not yet commenced, \"primarily for datacenters,\" rose to $364.6B from $329.1B on June 30.<\/p>\n<p><strong>[OPINION]<\/strong> Under US lease accounting, a lease counts as a finance lease when it covers a major part of the asset's economic life. A 25-year building life makes the same lease a smaller part of that life, so more leases land as operating leases and drop out of reported capex. That changes how the spending is reported; Microsoft said in July that the underlying plan was unchanged. The July step was lease presentation, by Microsoft's account. The October step has a different stated cause (see below).<\/p>\n<p>會計重點：微軟把機房年限從 15 年拉長到 25 年後，更多新租約改列營業租賃，不計入資本支出。10-Q 顯示本季新增營業租賃資產 65 億美元，多於 FY26 全年的 46 億；尚未起租的租約升至 3,646 億美元。10/28 微軟再把 2026 年預估降到約 1,700 億美元，理由是第三方算力交付延後到下半財年。<\/p>\n<p><strong>[FACT]<\/strong> On Oct 28 Microsoft lowered its calendar-2026 figure again, to \"approximately $170 billion,\" citing \"3P capacity delays\": \"some third-party capacity deliveries we expected in Q1 were delayed\" and have \"shifted to H2.\" It expects capex to \"accelerate\" in the second half of FY27, \"primarily from CPUs, inclusive of higher memory and storage costs, and GPUs\" (<a target=\"_blank\" rel=\"noopener\" href=\"https://aka.ms/transcriptfy27q1\">FY27 Q1 transcript<\/a>). <strong>[ESTIMATE]<\/strong> $31.9B + $41.0B + $45.2B = $118.1B for Jan–Sep 2026, so ~$170B implies ~$52B in Oct–Dec, in line with \"over $50 billion.\"<\/p>",
    "en": "<h2>會計 The accounting<\/h2>\n<p><strong>[FACT]<\/strong> On its Jul 29 call, Microsoft said that from FY27 it extends datacenter and office-building lives \"from 15 to 25 years,\" and that \"more of our future datacenter leases will shift from finance leases to operating leases ... Finance leases are included in capital expenditures while operating leases are not. Outside of this useful life impact, our calendar year 2026 CapEx investment expectations remain unchanged.\" That moved its calendar-2026 figure to \"approximately $175 billion\" (<a target=\"_blank\" rel=\"noopener\" href=\"https://aka.ms/transcriptfy26q4\">FY26 Q4 transcript<\/a>). In April it had said \"roughly $190 billion\" (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q3\">FY26 Q3 call<\/a>).<\/p>\n<p><strong>[FACT]<\/strong> The FY27 Q1 10-Q (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/789019/000119312526436133/msft-20260930.htm\">Note 12, Leases<\/a>) shows the shift: right-of-use assets obtained for operating leases were $6.5B in the quarter, vs $1.4B a year earlier and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm\">$4.6B for all of FY26<\/a>. Finance-lease additions fell to $5.2B from $9.1B. Leases signed but not yet commenced, \"primarily for datacenters,\" rose to $364.6B from $329.1B on June 30.<\/p>\n<p><strong>[OPINION]<\/strong> Under US lease accounting, a lease counts as a finance lease when it covers a major part of the asset's economic life. A 25-year building life makes the same lease a smaller part of that life, so more leases land as operating leases and drop out of reported capex. That changes how the spending is reported; Microsoft said in July that the underlying plan was unchanged. The July step was lease presentation, by Microsoft's account. The October step has a different stated cause (see below).<\/p>\n<p>會計重點：微軟把機房年限從 15 年拉長到 25 年後，更多新租約改列營業租賃，不計入資本支出。10-Q 顯示本季新增營業租賃資產 65 億美元，多於 FY26 全年的 46 億；尚未起租的租約升至 3,646 億美元。10/28 微軟再把 2026 年預估降到約 1,700 億美元，理由是第三方算力交付延後到下半財年。<\/p>\n<p><strong>[FACT]<\/strong> On Oct 28 Microsoft lowered its calendar-2026 figure again, to \"approximately $170 billion,\" citing \"3P capacity delays\": \"some third-party capacity deliveries we expected in Q1 were delayed\" and have \"shifted to H2.\" It expects capex to \"accelerate\" in the second half of FY27, \"primarily from CPUs, inclusive of higher memory and storage costs, and GPUs\" (<a target=\"_blank\" rel=\"noopener\" href=\"https://aka.ms/transcriptfy27q1\">FY27 Q1 transcript<\/a>). <strong>[ESTIMATE]<\/strong> $31.9B + $41.0B + $45.2B = $118.1B for Jan–Sep 2026, so ~$170B implies ~$52B in Oct–Dec, in line with \"over $50 billion.\"<\/p>"

    "zh": "<h2>台灣供應鏈 Taiwan read<\/h2>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Bucket 類別<\/th>\n<th>What moved 變化 [FACT]<\/th>\n<th>Taiwan names 台灣廠商<\/th>\n<th>Read 解讀 [OPINION]<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Servers 伺服器<\/td>\n<td>Microsoft short-lived share ~2/3 → ~3/4; ≈ $34B [ESTIMATE]. Alphabet Q3 capex $51.4B; Cloud +103%, with TPU systems \"a meaningful contributor\"<\/td>\n<td>Quanta 廣達, Wiwynn 緯穎, Wistron 緯創 (rack assembly)<\/td>\n<td>The bucket that grew is the one where Taiwan's server makers sit. Their October sales are the next check<\/td>\n<\/tr>\n<tr>\n<td>Buildings, power 機房、電力<\/td>\n<td>Microsoft long-lived capex ≈ $11B [ESTIMATE]; operating-lease additions $6.5B; pre-commencement leases $364.6B<\/td>\n<td>Delta 台達電 (power, cooling)<\/td>\n<td>Building activity now shows up partly in Microsoft's lease book, outside capex. Delta (power and cooling) sits on this side<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>We make no claims about specific customer relationships or order sizes here.\n本文不推論個別客戶關係或訂單規模。<\/p>",

    const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
    for(let g=0;g<=4;g++){const y=p.t+ih*g/4;s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#2A2F37"/><text x="${p.l-8}" y="${y+5}" text-anchor="end" font-size="20" fill="#9AA3AE" font-family="Space Grotesk">${+(max*(1-g/4)).toFixed(1)}</text>`}
    s+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#ECEEF1" stroke-width="4" stroke-linejoin="round"/>`;
    pts.forEach((q,i)=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${i===hi?9:5}" fill="${i===hi?'#2563EB':'#ECEEF1'}"/><text x="${q[0]}" y="${H-10}" text-anchor="middle" font-size="20" fill="#D5D9DE" font-family="Space Grotesk, Noto Sans TC">${esc(t(d[i].label))}</text>`});
    return s+'</svg>';
  }
  const rh=78,W=640,H=d.length*rh;const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
  d.forEach((x,i)=>{const y=i*rh,w=Math.max(4,(x.value/max)*(W-110));
    s+=`<text x="0" y="${y+26}" font-size="24" fill="#D5D9DE" font-family="Noto Sans TC, Space Grotesk">${esc(t(x.label))}</text>
    <rect x="0" y="${y+38}" width="${W-110}" height="22" rx="11" fill="#232830"/>
    <rect class="bar-fill" x="0" y="${y+38}" width="${w}" height="22" rx="11" fill="${i===hi?'#2563EB':'#8B95A3'}"/>
    <text x="${W}" y="${y+57}" text-anchor="end" font-size="24" font-weight="700" fill="#ECEEF1" font-family="Space Grotesk">${esc(typeof x.value==='number'?x.value.toLocaleString('en-US'):x.value)}${esc(unit)}</text>`});
  return s+'</svg>';
}
function render(){
  document.documentElement.lang=L==='zh'?'zh-Hant':'en';
  document.querySelectorAll('.toggle button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.querySelector('[data-t=tagline]').textContent=UI[L].tagline;
  const u=D.inlineBilingual?Object.fromEntries(Object.keys(UI.en).map(k=>[k,UI.en[k]+' '+UI.zh[k]])):UI[L],h=D.hero;let o='';
  o+=`<div class="hero"><svg class="big" style="color:#ECEEF1;--bg:#0B0C0E"><use href="#lens"/></svg><div class="wrap">
    <div class="kicker">${esc(t(h.kicker))}</div><h1>${esc(t(h.title))}</h1><p class="sub">${esc(t(h.subtitle))}</p>
    <div class="date">${u.updated} · ${esc(h.date)}</div><span class="rule"></span></div></div><div class="wrap">`;
  if(D.intro)o+=`<section class="md">${tag(t(D.intro))}</section>`;
  if(D.summary||D.stats?.length){o+=`<section><h2>${u.summary}</h2>`;if(D.summary)o+=`<p class="lead">${esc(t(D.summary))}</p>`;
    if(D.stats?.length)o+=`<div class="stats" aria-label="${u.numbers}">${D.stats.map(s=>`<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(t(s.label))}</div></div>`).join('')}</div>`;o+='</section>'}
  if(D.charts?.length){o+=`<section><h2>${u.charts}</h2>`+D.charts.map(c=>`<div class="chart"><h3>${esc(t(c.title))}</h3>${chart(c)}${t(c.note)?`<p class="note">${esc(t(c.note))}</p>`:''}</div>`).join('')+'</section>'}
  if(D.tables?.length){o+=`<section><h2>${u.tables}</h2>`+D.tables.map(tb=>{const num=tb.rows.length?tb.rows[0].map((_,j)=>tb.rows.every(r=>!isNaN(parseFloat(r[j]))&&j>0)):[];
    return `<h3>${esc(t(tb.title))}</h3><div class="tscroll"><table><thead><tr>${tb.columns.map((c,j)=>`<th class="${num[j]?'num':''}">${esc(t(c))}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${r.map((v,j)=>`<td class="${num[j]?'num':''}">${esc(t(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">${u.scroll}${t(tb.note)?' · '+esc(t(tb.note)):''}</p>`}).join('')+'</section>'}
  (D.sections||[]).forEach(s=>{if(s.html){o+=`<section class="md">${tag(t(s.html))}</section>`;return}o+=`<section><h2>${esc(t(s.heading))}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(t(p))}</p>`).join('')}${s.quote?`<blockquote>${esc(t(s.quote))}</blockquote>`:''}</section>`});
  if(D.sources?.length)o+=`<section class="sources"><h2>${u.sources}</h2><ol>${D.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t(s.title))}</a>${t(s.note)?` — <span class="note">${esc(t(s.note))}</span>`:''}</li>`).join('')}</ol></section>`;
  document.getElementById('app').innerHTML=o+'</div>';
  document.querySelector('.toggle').style.display=D.inlineBilingual?'none':'';
  document.title=t(h.title)+' · Bluey Lens 布利觀點';
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('bl-lang',L);history.replaceState(null,'','?lang='+L);render()});
render();
})();
</script>
</body>
</html>
