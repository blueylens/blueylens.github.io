   "html": {
    "zh": "<h2>1. The mechanism 錢怎麼流<\/h2>\n<p>Hyperscalers (about $735B of 2026 capex) → buy racks from ODMs (5–6% gross margin) → ODMs buy GPUs/ASICs from chip designers → designers buy wafers and CoWoS packaging from TSMC (66.4% gross margin, 3Q26).<\/p>\n<p><strong>Fact 事實:<\/strong> Amazon, Alphabet, Microsoft and Meta guide to about $735B of 2026 capex at midpoints (our sum). That is Amazon about $220B, Alphabet $195–205B, Microsoft about $175B, and Meta $135–145B (raised Oct 21). Meta's range is from its Q3 release; the other three were compiled from secondary roundups. Only part of the total buys servers; the rest goes to buildings, power and networking.<\/p>\n<p>The cash moves downstream like this. A hyperscaler orders AI racks, mostly from Taiwanese ODMs (Hon Hai, Quanta, Wistron). The ODM buys the GPU or ASIC board from Nvidia, Broadcom and others. Those designers pay TSMC for wafers and CoWoS packaging. The ODM's invoice carries everything inside the rack, so its revenue is large and its margin is thin.<\/p>\n<p>雲端巨頭向台灣 ODM 下單買整櫃伺服器;ODM 向輝達或 ASIC 廠買晶片;晶片設計商再向台積電買晶圓與 CoWoS 封裝。ODM 的營收包含整櫃所有零件,所以營收巨大、毛利很薄。<\/p>",

    "zh": "<h2>2. Where value accrues 價值落在哪一層<\/h2>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Company 公司<\/th>\n<th style=\"text-align: right;\">Gross margin 毛利率<\/th>\n<th>Period<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TSMC 台積電<\/td>\n<td style=\"text-align: right;\">66.4%<\/td>\n<td>3Q26<\/td>\n<\/tr>\n<tr>\n<td>TSMC 台積電<\/td>\n<td style=\"text-align: right;\">67.7%<\/td>\n<td>2Q26 (<a target=\"_blank\" rel=\"noopener\" href=\"https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-07/6f49632674bd2d0fd48cb65aaf89ec6ab510b559/2Q26%20ManagementReport.pdf\">TSMC 2Q26 Management Report<\/a>; <a target=\"_blank\" rel=\"noopener\" href=\"https://investor.tsmc.com/english/quarterly-results/2026/q2\">2Q26 results<\/a>)<\/td>\n<\/tr>\n<tr>\n<td>Hon Hai 鴻海<\/td>\n<td style=\"text-align: right;\">6.12%<\/td>\n<td>2Q26<\/td>\n<\/tr>\n<tr>\n<td>Wistron 緯創<\/td>\n<td style=\"text-align: right;\">5.66%<\/td>\n<td>2Q26<\/td>\n<\/tr>\n<tr>\n<td>Quanta 廣達<\/td>\n<td style=\"text-align: right;\">5.02%<\/td>\n<td>2Q26 (MOPS)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Framework 框架 (Stratechery):<\/strong> in a modular value chain, profit flows to the piece that cannot be substituted and that integrates everything around it.<\/p>\n<p><strong>Opinion 觀點:<\/strong> in the AI server chain, TSMC is the sole leading-edge foundry, and Nvidia integrates chips, NVLink networking and software (CUDA), so the margin pools at those two. The rack itself is a modular, specified product, which is why its assemblers earn 5–6%. The hyperscalers are trying to pull the chain toward their own integration with custom ASICs (TPU, Trainium). That shifts margin from Nvidia to Broadcom-style partners, not to the ODMs, and either way the wafer still comes from TSMC.<\/p>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Player 角色<\/th>\n<th>Incentive 誘因 (Opinion 觀點)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hyperscalers 雲端巨頭<\/td>\n<td>Losing the AI platform costs more than overbuilding, so they spend through thin FCF<\/td>\n<\/tr>\n<tr>\n<td>Nvidia 輝達<\/td>\n<td>Keep supply tight and finance demand where needed. Every rack sold is margin<\/td>\n<\/tr>\n<tr>\n<td>TSMC 台積電<\/td>\n<td>Add capacity just slower than demand, and protect price and utilization<\/td>\n<\/tr>\n<tr>\n<td>ODMs 代工組裝<\/td>\n<td>Win volume and share; margin is set by customers who can multi-source<\/td>\n<\/tr>\n<tr>\n<td>Neoclouds 新雲<\/td>\n<td>Borrow against contracts to grab GPUs before rivals do<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
    "en": "<h2>2. Where value accrues 價值落在哪一層<\/h2>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Company 公司<\/th>\n<th style=\"text-align: right;\">Gross margin 毛利率<\/th>\n<th>Period<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TSMC 台積電<\/td>\n<td style=\"text-align: right;\">66.4%<\/td>\n<td>3Q26<\/td>\n<\/tr>\n<tr>\n<td>TSMC 台積電<\/td>\n<td style=\"text-align: right;\">67.7%<\/td>\n<td>2Q26 (<a target=\"_blank\" rel=\"noopener\" href=\"https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-07/6f49632674bd2d0fd48cb65aaf89ec6ab510b559/2Q26%20ManagementReport.pdf\">TSMC 2Q26 Management Report<\/a>; <a target=\"_blank\" rel=\"noopener\" href=\"https://investor.tsmc.com/english/quarterly-results/2026/q2\">2Q26 results<\/a>)<\/td>\n<\/tr>\n<tr>\n<td>Hon Hai 鴻海<\/td>\n<td style=\"text-align: right;\">6.12%<\/td>\n<td>2Q26<\/td>\n<\/tr>\n<tr>\n<td>Wistron 緯創<\/td>\n<td style=\"text-align: right;\">5.66%<\/td>\n<td>2Q26<\/td>\n<\/tr>\n<tr>\n<td>Quanta 廣達<\/td>\n<td style=\"text-align: right;\">5.02%<\/td>\n<td>2Q26 (MOPS)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Framework 框架 (Stratechery):<\/strong> in a modular value chain, profit flows to the piece that cannot be substituted and that integrates everything around it.<\/p>\n<p><strong>Opinion 觀點:<\/strong> in the AI server chain, TSMC is the sole leading-edge foundry, and Nvidia integrates chips, NVLink networking and software (CUDA), so the margin pools at those two. The rack itself is a modular, specified product, which is why its assemblers earn 5–6%. The hyperscalers are trying to pull the chain toward their own integration with custom ASICs (TPU, Trainium). That shifts margin from Nvidia to Broadcom-style partners, not to the ODMs, and either way the wafer still comes from TSMC.<\/p>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Player 角色<\/th>\n<th>Incentive 誘因 (Opinion 觀點)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hyperscalers 雲端巨頭<\/td>\n<td>Losing the AI platform costs more than overbuilding, so they spend through thin FCF<\/td>\n<\/tr>\n<tr>\n<td>Nvidia 輝達<\/td>\n<td>Keep supply tight and finance demand where needed. Every rack sold is margin<\/td>\n<\/tr>\n<tr>\n<td>TSMC 台積電<\/td>\n<td>Add capacity just slower than demand, and protect price and utilization<\/td>\n<\/tr>\n<tr>\n<td>ODMs 代工組裝<\/td>\n<td>Win volume and share; margin is set by customers who can multi-source<\/td>\n<\/tr>\n<tr>\n<td>Neoclouds 新雲<\/td>\n<td>Borrow against contracts to grab GPUs before rivals do<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"

   "html": {
    "zh": "<h2>3. Binding constraints 真正的限制<\/h2>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Layer 層級<\/th>\n<th>Their logic, stated fairly 對方邏輯<\/th>\n<th>Binding constraint 真正限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hyperscalers<\/td>\n<td>Backlog proves demand (RPO: Microsoft $678B, Google Cloud $514B, AWS $496B; secondary source)<\/td>\n<td>Free cash flow. Alphabet Q2 FCF −$5.9B; Meta $0.8B (secondary source)<\/td>\n<\/tr>\n<tr>\n<td>Neoclouds (CoreWeave)<\/td>\n<td>98% of revenue comes from committed contracts (10-Q), so the debt is backed by cash flow<\/td>\n<td>Cost of debt and concentration (see below)<\/td>\n<\/tr>\n<tr>\n<td>Nvidia / ASIC<\/td>\n<td>Demand exceeds supply<\/td>\n<td>TSMC CoWoS/N2 capacity, plus export rules for China<\/td>\n<\/tr>\n<tr>\n<td>TSMC<\/td>\n<td>Multi-year demand; 2026–28 capex \"significantly higher\"<\/td>\n<td>Tools (\"tool supply is tight\") and Arizona cost (3–4% GM dilution)<\/td>\n<\/tr>\n<tr>\n<td>ODMs<\/td>\n<td>Rack integration is hard; scale wins<\/td>\n<td>Substitutability: customers can split orders across 3+ ODMs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Fact 事實 (CoreWeave 10-Q, quarter ended June 30, 2026):<\/strong> the three largest customers were 36%, 26% and 10% of Q2 revenue. Debt was $31.41B recourse and $3.66B non-recourse, $35.1B in total, net of issuance costs. Effective rates on recourse facilities ran 9–15%, while convertibles were at 2%.<\/p>\n<p><strong>Opinion 觀點:<\/strong> CoreWeave's model works while contracts arrive faster than refinancing costs rise. It is a financing business that happens to run GPUs.<\/p>\n<p><strong>Counterargument 反方觀點:<\/strong> \"Backlogs are huge, so capex is safe.\" Rebuttal: RPO is revenue that has been contracted, not cash in hand. It includes commitments from AI labs that are themselves loss-making and raising money. WSJ reports Anthropic's draft S-1 shows an $80.7B first-half net loss, most of it a non-cash charge per Reuters, against more than $600B of compute commitments (press-sourced). The backlog is only as strong as its weakest large counterparty.<\/p>",
    "en": "<h2>3. Binding constraints 真正的限制<\/h2>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Layer 層級<\/th>\n<th>Their logic, stated fairly 對方邏輯<\/th>\n<th>Binding constraint 真正限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hyperscalers<\/td>\n<td>Backlog proves demand (RPO: Microsoft $678B, Google Cloud $514B, AWS $496B; secondary source)<\/td>\n<td>Free cash flow. Alphabet Q2 FCF −$5.9B; Meta $0.8B (secondary source)<\/td>\n<\/tr>\n<tr>\n<td>Neoclouds (CoreWeave)<\/td>\n<td>98% of revenue comes from committed contracts (10-Q), so the debt is backed by cash flow<\/td>\n<td>Cost of debt and concentration (see below)<\/td>\n<\/tr>\n<tr>\n<td>Nvidia / ASIC<\/td>\n<td>Demand exceeds supply<\/td>\n<td>TSMC CoWoS/N2 capacity, plus export rules for China<\/td>\n<\/tr>\n<tr>\n<td>TSMC<\/td>\n<td>Multi-year demand; 2026–28 capex \"significantly higher\"<\/td>\n<td>Tools (\"tool supply is tight\") and Arizona cost (3–4% GM dilution)<\/td>\n<\/tr>\n<tr>\n<td>ODMs<\/td>\n<td>Rack integration is hard; scale wins<\/td>\n<td>Substitutability: customers can split orders across 3+ ODMs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Fact 事實 (CoreWeave 10-Q, quarter ended June 30, 2026):<\/strong> the three largest customers were 36%, 26% and 10% of Q2 revenue. Debt was $31.41B recourse and $3.66B non-recourse, $35.1B in total, net of issuance costs. Effective rates on recourse facilities ran 9–15%, while convertibles were at 2%.<\/p>\n<p><strong>Opinion 觀點:<\/strong> CoreWeave's model works while contracts arrive faster than refinancing costs rise. It is a financing business that happens to run GPUs.<\/p>\n<p><strong>Counterargument 反方觀點:<\/strong> \"Backlogs are huge, so capex is safe.\" Rebuttal: RPO is revenue that has been contracted, not cash in hand. It includes commitments from AI labs that are themselves loss-making and raising money. WSJ reports Anthropic's draft S-1 shows an $80.7B first-half net loss, most of it a non-cash charge per Reuters, against more than $600B of compute commitments (press-sourced). The backlog is only as strong as its weakest large counterparty.<\/p>"

   "html": {
    "zh": "<h2>4. Griffin, airlines and dark fiber 航空與暗光纖<\/h2>\n<blockquote>\n<p>\"GPUs have very low marginal operating costs, much like airlines. When capacity exceeds demand, pricing can go into freefall. We saw a similar dynamic during the telecom buildout in 2000, when excess fiber capacity drove telecommunications prices sharply lower.\"\n— Ken Griffin, Citadel Securities Future of Global Markets Conference, New York, Oct 21 morning Taipei time (Oct 20 evening ET); published by Citadel Securities Oct 23<\/p>\n<\/blockquote>\n<p>Griffin also said investors should reconsider GPU useful lives: \"revenue and valuation assumptions for years seven, eight and nine need to be reconsidered.\" (Citadel Securities, MarketWatch, WSJ.)<\/p>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>Layer 層級<\/th>\n<th>Airline fit 貼切度 (Opinion 觀點)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Neoclouds<\/td>\n<td>Strong: perishable GPU-hours on fixed debt<\/td>\n<\/tr>\n<tr>\n<td>Hyperscalers<\/td>\n<td>Partial: exposure via depreciation, not spot price<\/td>\n<\/tr>\n<tr>\n<td>Nvidia<\/td>\n<td>Lagged: sells the planes, not the seats<\/td>\n<\/tr>\n<tr>\n<td>TSMC<\/td>\n<td>Weak: sole source; risk is utilization, not price<\/td>\n<\/tr>\n<tr>\n<td>ODMs<\/td>\n<td>Moderate: no perishable capacity, but no cushion<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Fact 事實 (prices):<\/strong> H100 on-demand median rent is $3.75/hr across 40 providers, +26% year on year (GetDeploying, week of Oct 19). AIMultiple's September median was $3.25. GPU Economy's index fell from $3.92 (week of Sep 7) to $3.39 (week of Oct 19, provisional). There is no freefall yet.<\/p>\n<p><strong>Fact 事實 (10-Ks):<\/strong> Amazon depreciates servers over five to six years and cut a subset from six to five in 2025, citing AI. Meta extended most servers to 5.5 years in 2025. Alphabet generally uses six years and Microsoft two to six years (these two from a secondary compilation).<\/p>\n<p><strong>Opinion 觀點:<\/strong> the historical lesson of 2000, and of the railroads, is that the infrastructure survived but its leveraged owners did not. In this chain the leveraged owners are the neoclouds, not TSMC. Taiwan's exposure comes later and through volume: if racks stop selling, the ODMs feel it within a quarter, and TSMC feels it as lower utilization a few quarters on.<\/p>",

.toggle button{all:unset;cursor:pointer;padding:3px 13px;border-radius:999px;font:700 14px var(--lat);color:var(--mute);min-width:24px;text-align:center}
.toggle button[aria-pressed=true]{background:var(--ink);color:#0B0C0E}
.toggle button:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(37,99,235,.20),transparent 55%),var(--bg);color:var(--ink);padding:52px 0 44px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .big{position:absolute;right:-50px;top:-50px;width:150px;height:150px}
.kicker{position:relative;padding-right:96px;font:700 12.5px var(--lat);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
html[lang=zh-Hant] .kicker{letter-spacing:.08em}
h1{font-weight:900;font-size:clamp(28px,7.4vw,54px);line-height:1.2;margin:14px 0 12px;max-width:20ch;position:relative;color:#fff;letter-spacing:-.01em}
.sub{font-size:19px;color:var(--text);margin:0 0 20px;max-width:34ch;position:relative}
.date{font:500 14px var(--lat);color:var(--mute)}
.rule{display:block;width:48px;height:4px;border-radius:2px;background:var(--blue);margin:22px 0 0}
section{padding:40px 0 4px}
h2{font-size:25px;line-height:1.3;margin:0 0 18px;font-weight:900;color:var(--ink)}
h2::before{content:"";display:block;width:28px;height:4px;border-radius:2px;background:var(--blue);margin-bottom:14px}
h3{font-size:18px;margin:26px 0 12px;color:var(--ink)}
p{margin:0 0 1em}strong{color:var(--ink)}
.lead{font-size:18px;color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .v{font:700 clamp(30px,8vw,44px)/1.05 var(--lat);letter-spacing:-.02em;color:#fff}
.stat:first-child{background:linear-gradient(160deg,rgba(37,99,235,.28),rgba(37,99,235,.08));border-color:rgba(96,165,250,.45)}
.stat .l{font-size:14px;line-height:1.5;margin-top:8px;color:var(--mute)}
.chart{margin:8px 0 26px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px}
.chart h3{margin-top:0}
.chart svg{width:100%;max-width:600px;height:auto;display:block}
.note{font-size:14px;color:var(--mute);line-height:1.6}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 1em}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:480px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card2);color:var(--ink);font-weight:700}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
td.num,th.num{text-align:right;font-family:var(--lat);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
blockquote{margin:24px 0;padding:12px 16px;border-left:3px solid var(--blue);background:var(--card);border-radius:0 10px 10px 0;font-size:18px;font-weight:700;color:var(--ink)}
.sources ol{padding-left:22px}.sources li{margin:8px 0;word-break:break-word}
.md h2{margin-top:12px}.md table{min-width:0;white-space:normal;font-size:14px}.md th,.md td{padding:9px 10px;white-space:normal;vertical-align:top}
.md ul,.md ol{padding-left:22px}.md li{margin:6px 0}.md li::marker{color:var(--mute)}.md code{font-size:.9em;background:var(--card2);padding:1px 5px;border-radius:5px}
.md blockquote{font-weight:500;font-size:17px;color:var(--text)}
.md .disclaimer{background:rgba(37,99,235,.10);border:1px solid rgba(96,165,250,.40);border-left:4px solid var(--blue);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15.5px;color:var(--ink);margin:18px 0}
.md .disclaimer p{margin:0}
.md a{overflow-wrap:anywhere}.md hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.tag{display:inline-block;font:700 11.5px/1.5 var(--lat);letter-spacing:.04em;padding:0 7px;border-radius:5px;border:1px solid;vertical-align:1px;white-space:nowrap}
.tag-fact{color:#86EFAC;border-color:rgba(134,239,172,.45);background:rgba(34,197,94,.10)}
.tag-opinion{color:#93C5FD;border-color:rgba(147,197,253,.45);background:rgba(37,99,235,.14)}
.tag-rumor,.tag-reported{color:#FCD34D;border-color:rgba(252,211,77,.45);background:rgba(245,158,11,.10)}
.tag-inference{color:#C4B5FD;border-color:rgba(196,181,253,.45);background:rgba(139,92,246,.12)}
footer{margin-top:56px;background:#070809;border-top:1px solid var(--line);color:var(--mute);padding:32px 0;font-size:15px}
footer a{color:var(--ink);text-decoration:none;font-weight:700}footer .brand{color:var(--ink)}
@media(min-width:720px){h1{max-width:15em}.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:84px 0 68px}.hero .big{right:-70px;top:-70px;width:280px;height:280px}body{font-size:18px}}
@media(prefers-reduced-motion:no-preference){.bar-fill{transition:width .6s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="lens" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="currentColor"/><circle cx="50" cy="50" r="32.5" fill="var(--bg,#fff)"/><circle cx="50" cy="50" r="15.3" fill="#2563EB"/></symbol></svg>
<header class="bar"><div class="wrap">
  <a class="brand" href="https://x.com/BlueyLensTW"><svg class="mark" style="color:#ECEEF1;--bg:#0B0C0E"><use href="#lens"/></svg>Bluey Lens</a>
  <div class="toggle" role="group" aria-label="Language"><button data-l="zh">中</button><button data-l="en">EN</button></div>
</div></header>
<main id="app"></main>
<footer><div class="wrap">
  <a class="brand" href="https://x.com/BlueyLensTW" target="_blank" rel="noopener"><svg class="mark" style="color:#ECEEF1;--bg:#070809"><use href="#lens"/></svg>Bluey Lens 布利觀點 · @BlueyLensTW</a>
  <p style="margin:10px 0 0" data-t="tagline"></p>
</div></footer>
<script>
(function(){
const D=JSON.parse(document.getElementById('report-data').textContent);
const UI={zh:{summary:'重點摘要',numbers:'關鍵數字',charts:'圖表',tables:'數據表',sources:'資料來源',tagline:'從台北看矽谷',scroll:'表格可左右滑動',updated:'發布日期'},
          en:{summary:'Key takeaways',numbers:'Key numbers',charts:'Charts',tables:'Data tables',sources:'Sources',tagline:'Silicon Valley, seen from Taipei',scroll:'Scroll sideways to see all columns',updated:'Published'}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('bl-lang')||'zh';
const t=o=>o==null?'':(typeof o==='string'||typeof o==='number')?o:(o[L]||o.zh||o.en||'');
const tag=h=>String(h).replace(/\[(FACT|OPINION|RUMOR|REPORTED|INFERENCE)\]/g,(m,k)=>`<span class="tag tag-${k.toLowerCase()}">${m}</span>`);
function chart(c){
  const d=c.data,max=Math.max(...d.map(x=>x.value))||1,unit=c.unit||'';
  if(c.type==='line'){
    const W=640,H=300,p={l:40,r:16,t:20,b:36},iw=W-p.l-p.r,ih=H-p.t-p.b;
    const pts=d.map((x,i)=>[p.l+(d.length>1?i*iw/(d.length-1):iw/2),p.t+ih-(x.value/max)*ih]);
    const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
    for(let g=0;g<=4;g++){const y=p.t+ih*g/4;s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#2A2F37"/><text x="${p.l-8}" y="${y+5}" text-anchor="end" font-size="20" fill="#9AA3AE" font-family="Space Grotesk">${+(max*(1-g/4)).toFixed(1)}</text>`}
    s+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#ECEEF1" stroke-width="4" stroke-linejoin="round"/>`;
    pts.forEach((q,i)=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${i===hi?9:5}" fill="${i===hi?'#2563EB':'#ECEEF1'}"/><text x="${q[0]}" y="${H-10}" text-anchor="middle" font-size="20" fill="#D5D9DE" font-family="Space Grotesk, Noto Sans TC">${esc(t(d[i].label))}</text>`});
    return s+'</svg>';
  }
  const rh=78,W=640,H=d.length*rh;const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
  d.forEach((x,i)=>{const y=i*rh,w=Math.max(4,(x.value/max)*(W-110));
    s+=`<text x="0" y="${y+26}" font-size="24" fill="#D5D9DE" font-family="Noto Sans TC, Space Grotesk">${esc(t(x.label))}</text>
    <rect x="0" y="${y+38}" width="${W-110}" height="22" rx="11" fill="#232830"/>
    <rect class="bar-fill" x="0" y="${y+38}" width="${w}" height="22" rx="11" fill="${i===hi?'#2563EB':'#8B95A3'}"/>
    <text x="${W}" y="${y+57}" text-anchor="end" font-size="24" font-weight="700" fill="#ECEEF1" font-family="Space Grotesk">${esc(x.value)}${esc(unit)}</text>`});
  return s+'</svg>';
}
function render(){
  document.documentElement.lang=L==='zh'?'zh-Hant':'en';
  document.querySelectorAll('.toggle button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.querySelector('[data-t=tagline]').textContent=UI[L].tagline;
  const u=D.inlineBilingual?Object.fromEntries(Object.keys(UI.en).map(k=>[k,UI.en[k]+' '+UI.zh[k]])):UI[L],h=D.hero;let o='';
  o+=`<div class="hero"><svg class="big" style="color:#ECEEF1;--bg:#0B0C0E"><use href="#lens"/></svg><div class="wrap">
    <div class="kicker">${esc(t(h.kicker))}</div><h1>${esc(t(h.title))}</h1><p class="sub">${esc(t(h.subtitle))}</p>
    <div class="date">${u.updated} · ${esc(h.date)}</div><span class="rule"></span></div></div><div class="wrap">`;
  if(D.intro)o+=`<section class="md">${tag(t(D.intro))}</section>`;
  if(D.summary||D.stats?.length){o+=`<section><h2>${u.summary}</h2>`;if(D.summary)o+=`<p class="lead">${esc(t(D.summary))}</p>`;
    if(D.stats?.length)o+=`<div class="stats" aria-label="${u.numbers}">${D.stats.map(s=>`<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(t(s.label))}</div></div>`).join('')}</div>`;o+='</section>'}
  if(D.charts?.length){o+=`<section><h2>${u.charts}</h2>`+D.charts.map(c=>`<div class="chart"><h3>${esc(t(c.title))}</h3>${chart(c)}${t(c.note)?`<p class="note">${esc(t(c.note))}</p>`:''}</div>`).join('')+'</section>'}
  if(D.tables?.length){o+=`<section><h2>${u.tables}</h2>`+D.tables.map(tb=>{const num=tb.rows.length?tb.rows[0].map((_,j)=>tb.rows.every(r=>!isNaN(parseFloat(r[j]))&&j>0)):[];
    return `<h3>${esc(t(tb.title))}</h3><div class="tscroll"><table><thead><tr>${tb.columns.map((c,j)=>`<th class="${num[j]?'num':''}">${esc(t(c))}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${r.map((v,j)=>`<td class="${num[j]?'num':''}">${esc(t(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">${u.scroll}${t(tb.note)?' · '+esc(t(tb.note)):''}</p>`}).join('')+'</section>'}
  (D.sections||[]).forEach(s=>{if(s.html){o+=`<section class="md">${tag(t(s.html))}</section>`;return}o+=`<section><h2>${esc(t(s.heading))}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(t(p))}</p>`).join('')}${s.quote?`<blockquote>${esc(t(s.quote))}</blockquote>`:''}</section>`});
  if(D.sources?.length)o+=`<section class="sources"><h2>${u.sources}</h2><ol>${D.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t(s.title))}</a>${t(s.note)?` — <span class="note">${esc(t(s.note))}</span>`:''}</li>`).join('')}</ol></section>`;
  document.getElementById('app').innerHTML=o+'</div>';
  document.querySelector('.toggle').style.display=D.inlineBilingual?'none':'';
  document.title=t(h.title)+' · Bluey Lens 布利觀點';
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('bl-lang',L);history.replaceState(null,'','?lang='+L);render()});
render();
})();
</script>
</body>
</html>
