    "zh": "<h2>反事實與隱形成本 Counterfactual and hidden cost<\/h2>\n<p><strong>[OPINION]<\/strong><\/p>\n<ul>\n<li><strong>Who pays for the memory spike?<\/strong> Mostly the end buyer, through higher ASPs, and the channel, which pulled in inventory in 1H26 ahead of price increases. IDC attributes the Q3 drop partly to that pull-in hangover.<\/li>\n<li><strong>The counterfactual:<\/strong> without the 1H pull-in, the brands' 1H revenue would have been lower and Q3 less weak. The memory squeeze shifted the timing of demand as well as its level.<\/li>\n<li><strong>The divergence across Taiwan brands is the signal.<\/strong> MSI, which is more consumer and gaming focused, is down YTD. ASUS, Acer and Compal, with broader mixes, are up. This is consistent with mix and non-PC businesses, not PC pricing alone, carrying growth.<\/li>\n<\/ul>",

<style>
:root{--ink:#0A0A0A;--paper:#FFFFFF;--blue:#2563EB;--mute:#6B6B6B;--line:#E6E6E6;--soft:#F5F5F5;
--lat:"Space Grotesk",system-ui,sans-serif;--tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--lat),var(--tc);font-size:17px;line-height:1.75}
html[lang=zh-Hant] body{font-family:var(--tc)}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
/* top bar */
.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--lat);font-weight:700;color:var(--ink);text-decoration:none;font-size:15px}
.mark{width:26px;height:26px;flex:none}
.toggle{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.toggle button{all:unset;cursor:pointer;padding:4px 14px;font:700 14px var(--lat);min-width:24px;text-align:center}
.toggle button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.toggle button:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
/* hero */
.hero{background:var(--ink);color:var(--paper);padding:56px 0 48px;position:relative;overflow:hidden}
.hero .big{position:absolute;right:-50px;top:-50px;width:150px;height:150px}
.kicker{font:700 13px var(--lat);letter-spacing:.12em;text-transform:uppercase;color:#9CA3AF}
html[lang=zh-Hant] .kicker{letter-spacing:.08em}
h1{font-weight:900;font-size:clamp(28px,7.4vw,56px);line-height:1.2;margin:14px 0 12px;max-width:20ch;position:relative}
.sub{font-size:19px;color:#D4D4D4;margin:0 0 20px;max-width:34ch;position:relative}
.date{font:500 14px var(--lat);color:#9CA3AF}
.rule{display:block;width:48px;height:5px;background:var(--blue);margin:22px 0 0}
/* sections */
section{padding:44px 0 8px}
h2{font-size:26px;line-height:1.3;margin:0 0 18px;font-weight:900}
h2::before{content:"";display:block;width:32px;height:4px;background:var(--blue);margin-bottom:14px}
h3{font-size:18px;margin:28px 0 12px}
.lead{font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.stat{border:1.5px solid var(--ink);border-radius:14px;padding:16px}
.stat .v{font:700 clamp(30px,8vw,44px)/1.05 var(--lat);letter-spacing:-.02em}
.stat:first-child{background:var(--ink);color:var(--paper)}
.stat:first-child .v{color:#fff}
.stat .l{font-size:14px;line-height:1.5;margin-top:8px;color:inherit;opacity:.8}
.chart{margin:8px 0 28px}
.chart svg{width:100%;max-width:600px;height:auto;display:block}
.note{font-size:14px;color:var(--mute);line-height:1.6}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:480px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);font-weight:700}
td.num,th.num{text-align:right;font-family:var(--lat);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
blockquote{margin:24px 0;padding:4px 0 4px 18px;border-left:4px solid var(--blue);font-size:19px;font-weight:700}
.sources ol{padding-left:22px}.sources li{margin:8px 0;word-break:break-word}
/* raw-HTML (markdown) sections */
.md h2{margin-top:12px}.md table{min-width:0;white-space:normal;font-size:14px}.md th,.md td{padding:8px}.md th,.md td{white-space:normal;vertical-align:top}
.md ul,.md ol{padding-left:22px}.md li{margin:6px 0}.md code{font-size:.9em}
.md blockquote{font-weight:500;font-size:17px}.md .disclaimer{border:2px solid var(--ink);border-left:6px solid var(--blue);padding:10px 14px;font-weight:700;font-size:16px;margin:18px 0}
.md a{overflow-wrap:anywhere}.md strong{font-weight:700}.md hr{border:0;border-top:1px solid var(--line);margin:32px 0}
footer{margin-top:56px;background:var(--ink);color:#D4D4D4;padding:32px 0;font-size:15px}
footer a{color:#fff;text-decoration:none;font-weight:700}
footer .brand{color:#fff}
@media(min-width:720px){h1{max-width:15em}.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:88px 0 72px}.hero .big{right:-70px;top:-70px;width:280px;height:280px}body{font-size:18px}}
@media(prefers-reduced-motion:no-preference){.bar-fill{transition:width .6s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="lens" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="currentColor"/><circle cx="50" cy="50" r="32.5" fill="var(--bg,#fff)"/><circle cx="50" cy="50" r="15.3" fill="#2563EB"/></symbol></svg>
<header class="bar"><div class="wrap">
  <a class="brand" href="https://x.com/BlueyLensTW"><svg class="mark" style="color:#0A0A0A;--bg:#fff"><use href="#lens"/></svg>Bluey Lens</a>
  <div class="toggle" role="group" aria-label="Language"><button data-l="zh">中</button><button data-l="en">EN</button></div>
</div></header>
<main id="app"></main>
<footer><div class="wrap">
  <a class="brand" href="https://x.com/BlueyLensTW" target="_blank" rel="noopener"><svg class="mark" style="color:#fff;--bg:#0A0A0A"><use href="#lens"/></svg>Bluey Lens 布利觀點 · @BlueyLensTW</a>
  <p style="margin:10px 0 0" data-t="tagline"></p>
</div></footer>
<script>
(function(){
const D=JSON.parse(document.getElementById('report-data').textContent);
const UI={zh:{summary:'重點摘要',numbers:'關鍵數字',charts:'圖表',tables:'數據表',sources:'資料來源',tagline:'從台北看矽谷',scroll:'表格可左右滑動',updated:'發布日期'},
          en:{summary:'Key takeaways',numbers:'Key numbers',charts:'Charts',tables:'Data tables',sources:'Sources',tagline:'Silicon Valley, seen from Taipei',scroll:'Scroll sideways to see all columns',updated:'Published'}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('bl-lang')||'zh';
const t=o=>o==null?'':(typeof o==='string'||typeof o==='number')?o:(o[L]||o.zh||o.en||'');
function chart(c){
  const d=c.data,max=Math.max(...d.map(x=>x.value))||1,unit=c.unit||'';
  if(c.type==='line'){
    const W=640,H=300,p={l:40,r:16,t:20,b:36},iw=W-p.l-p.r,ih=H-p.t-p.b;
    const pts=d.map((x,i)=>[p.l+(d.length>1?i*iw/(d.length-1):iw/2),p.t+ih-(x.value/max)*ih]);
    const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
    for(let g=0;g<=4;g++){const y=p.t+ih*g/4;s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#E6E6E6"/><text x="${p.l-8}" y="${y+5}" text-anchor="end" font-size="20" fill="#6B6B6B" font-family="Space Grotesk">${+(max*(1-g/4)).toFixed(1)}</text>`}
    s+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linejoin="round"/>`;
    pts.forEach((q,i)=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${i===hi?9:5}" fill="${i===hi?'#2563EB':'#0A0A0A'}"/><text x="${q[0]}" y="${H-10}" text-anchor="middle" font-size="20" fill="#0A0A0A" font-family="Space Grotesk, Noto Sans TC">${esc(t(d[i].label))}</text>`});
    return s+'</svg>';
  }
  const rh=78,W=640,H=d.length*rh;const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
  d.forEach((x,i)=>{const y=i*rh,w=Math.max(4,(x.value/max)*(W-110));
    s+=`<text x="0" y="${y+26}" font-size="24" fill="#0A0A0A" font-family="Noto Sans TC, Space Grotesk">${esc(t(x.label))}</text>
    <rect x="0" y="${y+38}" width="${W-110}" height="22" rx="11" fill="#F1F1F1"/>
    <rect class="bar-fill" x="0" y="${y+38}" width="${w}" height="22" rx="11" fill="${i===hi?'#2563EB':'#0A0A0A'}"/>
    <text x="${W}" y="${y+57}" text-anchor="end" font-size="24" font-weight="700" fill="#0A0A0A" font-family="Space Grotesk">${esc(x.value)}${esc(unit)}</text>`});
  return s+'</svg>';
}
function render(){
  document.documentElement.lang=L==='zh'?'zh-Hant':'en';
  document.querySelectorAll('.toggle button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.querySelector('[data-t=tagline]').textContent=UI[L].tagline;
  const u=D.inlineBilingual?Object.fromEntries(Object.keys(UI.en).map(k=>[k,UI.en[k]+' '+UI.zh[k]])):UI[L],h=D.hero;let o='';
  o+=`<div class="hero"><svg class="big" style="color:#fff;--bg:#0A0A0A"><use href="#lens"/></svg><div class="wrap">
    <div class="kicker">${esc(t(h.kicker))}</div><h1>${esc(t(h.title))}</h1><p class="sub">${esc(t(h.subtitle))}</p>
    <div class="date">${u.updated} · ${esc(h.date)}</div><span class="rule"></span></div></div><div class="wrap">`;
  if(D.intro)o+=`<section class="md">${t(D.intro)}</section>`;
  if(D.summary||D.stats?.length){o+=`<section><h2>${u.summary}</h2>`;if(D.summary)o+=`<p class="lead">${esc(t(D.summary))}</p>`;
    if(D.stats?.length)o+=`<div class="stats" aria-label="${u.numbers}">${D.stats.map(s=>`<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(t(s.label))}</div></div>`).join('')}</div>`;o+='</section>'}
  if(D.charts?.length){o+=`<section><h2>${u.charts}</h2>`+D.charts.map(c=>`<div class="chart"><h3>${esc(t(c.title))}</h3>${chart(c)}${t(c.note)?`<p class="note">${esc(t(c.note))}</p>`:''}</div>`).join('')+'</section>'}
  if(D.tables?.length){o+=`<section><h2>${u.tables}</h2>`+D.tables.map(tb=>{const num=tb.rows.length?tb.rows[0].map((_,j)=>tb.rows.every(r=>!isNaN(parseFloat(r[j]))&&j>0)):[];
    return `<h3>${esc(t(tb.title))}</h3><div class="tscroll"><table><thead><tr>${tb.columns.map((c,j)=>`<th class="${num[j]?'num':''}">${esc(t(c))}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${r.map((v,j)=>`<td class="${num[j]?'num':''}">${esc(t(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">${u.scroll}${t(tb.note)?' · '+esc(t(tb.note)):''}</p>`}).join('')+'</section>'}
  (D.sections||[]).forEach(s=>{if(s.html){o+=`<section class="md">${t(s.html)}</section>`;return}o+=`<section><h2>${esc(t(s.heading))}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(t(p))}</p>`).join('')}${s.quote?`<blockquote>${esc(t(s.quote))}</blockquote>`:''}</section>`});
  if(D.sources?.length)o+=`<section class="sources"><h2>${u.sources}</h2><ol>${D.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t(s.title))}</a>${t(s.note)?` — <span class="note">${esc(t(s.note))}</span>`:''}</li>`).join('')}</ol></section>`;
  document.getElementById('app').innerHTML=o+'</div>';
  document.querySelector('.toggle').style.display=D.inlineBilingual?'none':'';
  document.title=t(h.title)+' · Bluey Lens 布利觀點';
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('bl-lang',L);history.replaceState(null,'','?lang='+L);render()});
render();
})();
</script>
