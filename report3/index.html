  "zh": "<p><strong>Bluey Lens 布利觀點 (@BlueyLensTW), Oct 25, 2026<\/strong>\n從台北看矽谷 / Silicon Valley, seen from Taipei<\/p>\n<div class=\"disclaimer\"><p><strong>本文不構成投資建議 / Not investment advice.<\/strong><\/p><\/div>\n<p>Intel 3Q26 財報前的研究筆記（法說會：台北時間 2026/10/30（五）05:00）。我們認為 EMIB-T 短期是 CoWoS 短缺的洩壓閥，對台灣封測鏈偏機會；真正的約束是 Intel 能否把客戶興趣變成確定的外部訂單。\nA pre-earnings research note (call at 05:00 Fri Oct 30, 2026, Taipei time). Near term, EMIB-T is a relief valve for scarce CoWoS, so it is mostly an opportunity for Taiwan's packaging chain. The binding constraint is whether Intel can turn customer interest into firm external commitments.<\/p>\n<p><strong>標示說明 Labels:<\/strong>「事實 Fact」皆附一手或具名來源；「觀點 Opinion」「推論 Inference」為 Bluey Lens 判斷；「傳聞 Rumor」為供應鏈或媒體報導，未經公司證實。Facts carry sources; opinion and inference are labelled; rumor means media or supply-chain reports not confirmed by the companies. 所有日期為台北時間 All dates are Taipei time (UTC+8), unless they are a company's own fiscal date.<\/p>\n<hr />",
  "en": "<p><strong>Bluey Lens 布利觀點 (@BlueyLensTW), Oct 25, 2026<\/strong>\n從台北看矽谷 / Silicon Valley, seen from Taipei<\/p>\n<div class=\"disclaimer\"><p><strong>本文不構成投資建議 / Not investment advice.<\/strong><\/p><\/div>\n<p>Intel 3Q26 財報前的研究筆記（法說會：台北時間 2026/10/30（五）05:00）。我們認為 EMIB-T 短期是 CoWoS 短缺的洩壓閥，對台灣封測鏈偏機會；真正的約束是 Intel 能否把客戶興趣變成確定的外部訂單。\nA pre-earnings research note (call at 05:00 Fri Oct 30, 2026, Taipei time). Near term, EMIB-T is a relief valve for scarce CoWoS, so it is mostly an opportunity for Taiwan's packaging chain. The binding constraint is whether Intel can turn customer interest into firm external commitments.<\/p>\n<p><strong>標示說明 Labels:<\/strong>「事實 Fact」皆附一手或具名來源；「觀點 Opinion」「推論 Inference」為 Bluey Lens 判斷；「傳聞 Rumor」為供應鏈或媒體報導，未經公司證實。Facts carry sources; opinion and inference are labelled; rumor means media or supply-chain reports not confirmed by the companies. 所有日期為台北時間 All dates are Taipei time (UTC+8), unless they are a company's own fiscal date.<\/p>\n<hr />"

   "html": {
    "zh": "<h2>1. 論點摘要 Thesis<\/h2>\n<p><strong>觀點 Opinion<\/strong>\n- 短期（2026–27）：Intel EMIB-T 吸收的是 CoWoS 排不進的溢出需求，且仍需要台灣的載板、測試與 OSAT 產能，對日月光等偏機會。\n- 中期（2028 起）：若大型雲端客戶的 AI 晶片如期以 EMIB-T 量產，且 14A 拿到確定的外部客戶，台積電封裝份額與定價權才會真正受壓。目前客戶名單僅見<strong>傳聞<\/strong>（例如 TrendForce 報導的 Google TPU v9），未經公司證實。\n- Near term, EMIB-T absorbs overflow that CoWoS cannot serve and still leans on Taiwan's substrate, test and OSAT capacity.\n- From 2028, if hyperscaler AI chips ramp on EMIB-T as planned and 14A wins firm external customers, TSMC's packaging share and pricing power face real pressure. Customer names so far are <strong>rumor only<\/strong> (e.g. TrendForce's Google TPU v9 report), unconfirmed by the companies.<\/p>",

ue is still mostly a promise.<\/p>",

    "zh": "<h2>3. 10-Q 兩個大數字解謎 Two big 10-Q items, resolved<\/h2>\n<p>Source: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/50863/000005086326000157/intc-20260627.htm\">Intel 2Q26 10-Q<\/a><\/p>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>金額 Amount<\/th>\n<th>是什麼 What it is<\/th>\n<th>狀態 Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>−US$12.2B<\/td>\n<td>「合作夥伴出資淨額」= 買回 Apollo 愛爾蘭廠 49% 股權。Partner contributions, net = buyback of Apollo's Ireland stake. On Apr 8, 2026 Intel reacquired Apollo's 49% interest in Ireland SCIP (Fab 34) for US$14.2B cash including costs. 1H26 partner distributions were −US$14.34B, offset by US$4.08B of contributions, mainly Brookfield's share of the Arizona JV.<\/td>\n<td>事實 Fact (10-Q)<\/td>\n<\/tr>\n<tr>\n<td>−US$12.6B<\/td>\n<td>「利息及其他」≈ 美國商務部託管股公允價值損失。Interest and other ≈ fair-value loss on DOC Escrowed Shares: −US$12.53B in 2Q26, tied to the US Commerce Department's Secure Enclave deal (derivative liability US$15.6B at Jun 27, up from US$2.7B). Non-cash.<\/td>\n<td>事實 Fact (10-Q); 成因為推論 driver is inference: the loss tracks Intel's share-price rise<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>意涵 So what:<\/strong> Intel 2Q26 GAAP 淨損 −US$11.0B 大多為非現金；但 Apollo 買回是真金白銀，也是 1H26 現金+短投減少 US$7.7B、負債增加 US$4.0B 的主因。Intel's GAAP loss of −US$11.0B was mostly non-cash, but the Apollo buyback was real cash. It is the main reason cash and short-term investments fell by US$7.7B in 1H26 while debt rose by US$4.0B.<\/p>\n<p><strong>事實 Fact (10-Q):<\/strong> 美國商務部持有最多 2.41 億股、每股 US$20 的認股權證，若 Intel 對晶圓代工業務持股低於 51% 即可行使。The Commerce Department holds warrants for up to 241M shares at US$20, exercisable if Intel's stake in its foundry business drops below 51%. <strong>推論 Inference:<\/strong> this limits a foundry spin-off.<\/p>",

    "zh": "<h2>4. 約束條件 The binding constraint<\/h2>\n<p><strong>觀點 Opinion:<\/strong> 真正的瓶頸不是 CoWoS，也已不太是現金，而是 Intel 外部客戶的「確定承諾」。8 月增資約 US$22.6B（淨額，含超額配售）大幅補強資產負債表；但 Intel 已表明沒有確定訂單就不為外部客戶建 14A 產能，而 Foundry 每季仍虧約 US$2B。\nThe bottleneck is firm external commitments, not CoWoS and, after August, less so cash. The equity raise of about US$22.6B net (option exercised) shored up the balance sheet. But Intel has said it will not build 14A capacity for outsiders without firm commitments, and Foundry still loses about US$2B a quarter.<\/p>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>面向 Factor<\/th>\n<th>現況 Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CoWoS 產能 capacity<\/td>\n<td><strong>推論 Inference:<\/strong> 需求仍大於供給（台積電持續擴產並與 GlobalFoundries 合作補後段產能）。Demand still exceeds supply, inferred from TSMC's expansion and its GlobalFoundries backend work (<a target=\"_blank\" rel=\"noopener\" href=\"https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-10/eba4fac72873bf546b669bd2b5d973df5c93215d/TSMC%203Q26%20Transcript.pdf\">TSMC 3Q26 call<\/a>).<\/td>\n<\/tr>\n<tr>\n<td>Intel 外部客戶 customers<\/td>\n<td><strong>事實 Fact (Intel):<\/strong> EMIB-T「訂單積壓增加」、2027 隨客戶量產；14A 客戶決定落在 2H26–1H27。Growing EMIB-T backlog, ramps in 2027; 14A decisions 2H26–1H27 (<a target=\"_blank\" rel=\"noopener\" href=\"https://stockanalysis.com/stocks/intc/transcripts/653928-q2-2026/\">2Q26 call<\/a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.tomshardware.com/tech-industry/semiconductors/intel-says-it-has-two-prospective-customers-for-14a-expects-to-hear-about-commitments-in-second-half-of-2026\">Tom's Hardware<\/a>).<\/td>\n<\/tr>\n<tr>\n<td>現金與補貼 cash / subsidies<\/td>\n<td>6/27 現金+短投 US$29.7B，之後 8 月增資淨額約 US$22.6B（424B5 估計數；9/30 餘額待 3Q 財報）。1H26 實收政府資本補助僅 US$0.17B。Cash was US$29.7B at Jun 27, before the August raise (net proceeds of about US$22.6B is the prospectus estimate; the Sep 30 balance comes with 3Q results). Capital-related incentives received in 1H26: US$0.17B.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",

    "zh": "<h2>5. 近期公告 Intel announcements, Oct 15–25, 2026<\/h2>\n<ul>\n<li><strong>事實 Fact:<\/strong> 2026/10/15–10/25 期間，Intel 未發布新聞稿，也未向 SEC 申報 8-K。最近一則新聞稿為 10/13（台北時間；美東 10/12）的 agentic AI 開放基礎架構；最近一份 8-K 為 8/12（增資）。Intel issued no press release and filed no 8-K between Oct 15 and Oct 25, 2026. The latest press release is Oct 13 Taipei time (Oct 12 US Eastern), on agentic AI open infrastructure; the latest 8-K is Aug 12, on the equity offering. (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.intc.com/news-events/press-releases\">intc.com press releases<\/a>; SEC EDGAR, CIK 50863)<\/li>\n<li><strong>媒體報導 Media report, not an Intel filing:<\/strong> Tom's Hardware 與 eeNews Europe 報導，陳立武向 Bloomberg 表示 Intel 仍參與 Musk 的 Terafab 計畫，此前曾有台積電可能介入的傳聞；Musk 提出可將部分廠房轉租給台積電。報導未載明確切日期。Tom's Hardware and eeNews Europe report Lip-Bu Tan told Bloomberg that Intel remains part of Musk's Terafab project, after rumors that TSMC could take a role; Musk floated subleasing part of the fab to TSMC. The reports do not state an exact date. (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.tomshardware.com/tech-industry/semiconductors/musk-rejects-rumors-of-tsmc-takeover-of-terafab-intel-reaffirms-14a-node-deal-as-musk-floats-cleanroom-sublease\">Tom's Hardware<\/a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.eenewseurope.com/en/intel-terafab-deal-tsmc-takeover-rumours/\">eeNews Europe<\/a>)<\/li>\n<\/ul>",

    "zh": "<h2>7. 財報觀察重點 What to watch in Intel's 3Q26 results<\/h2>\n<p>Intel 於美西 10/29 盤後公布，台北時間 10/30（五）05:00 法說會（<a target=\"_blank\" rel=\"noopener\" href=\"https://www.intc.com/news-events/press-releases/detail/1782/intel-to-report-third-quarter-2026-financial-results\">Intel<\/a>）。Results after the US close on Oct 29; call at 05:00 Fri Oct 30, 2026, Taipei time.<\/p>\n<div class=\"tscroll\"><table>\n<thead>\n<tr>\n<th>指標 Metric<\/th>\n<th>參考點 Reference point<\/th>\n<th>可能代表什麼 What it could signal<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>營收 Revenue<\/td>\n<td>Guide US$15.8–16.8B<\/td>\n<td>A miss blamed on supply would suggest internal products are absorbing capacity<\/td>\n<\/tr>\n<tr>\n<td>Non-GAAP GM<\/td>\n<td>Guide 42.0%<\/td>\n<td>A figure well below guide would point to 18A ramp costs<\/td>\n<\/tr>\n<tr>\n<td>Foundry 營業損益 op. loss<\/td>\n<td>2Q26: −US$2.09B<\/td>\n<td>Direction of the foundry loss trend<\/td>\n<\/tr>\n<tr>\n<td>EMIB-T 客戶 customers<\/td>\n<td>2Q26: \"growing backlog\", no names<\/td>\n<td>A named customer with revenue timing would strengthen the threat case for TSMC<\/td>\n<\/tr>\n<tr>\n<td>14A 承諾 commitment<\/td>\n<td>Decisions expected 2H26–1H27<\/td>\n<td>A firm external commitment, or decisions slipping into 2027<\/td>\n<\/tr>\n<tr>\n<td>現金/負債 Cash vs debt<\/td>\n<td>Jun 27: US$29.7B vs US$50.5B; August raise since<\/td>\n<td>How fast the raise is spent on capex, and whether customer prepayments appear<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",

    <rect x="0" y="${y+38}" width="${W-110}" height="22" rx="11" fill="#232830"/>
    <rect class="bar-fill" x="0" y="${y+38}" width="${w}" height="22" rx="11" fill="${i===hi?'#2563EB':'#8B95A3'}"/>
    <text x="${W}" y="${y+57}" text-anchor="end" font-size="24" font-weight="700" fill="#ECEEF1" font-family="Space Grotesk">${esc(x.value)}${esc(unit)}</text>`});
  return s+'</svg>';
}
function render(){
  document.documentElement.lang=L==='zh'?'zh-Hant':'en';
  document.querySelectorAll('.toggle button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.querySelector('[data-t=tagline]').textContent=UI[L].tagline;
  const u=D.inlineBilingual?Object.fromEntries(Object.keys(UI.en).map(k=>[k,UI.en[k]+' '+UI.zh[k]])):UI[L],h=D.hero;let o='';
  o+=`<div class="hero"><svg class="big" style="color:#ECEEF1;--bg:#0B0C0E"><use href="#lens"/></svg><div class="wrap">
    <div class="kicker">${esc(t(h.kicker))}</div><h1>${esc(t(h.title))}</h1><p class="sub">${esc(t(h.subtitle))}</p>
    <div class="date">${u.updated} · ${esc(h.date)}</div><span class="rule"></span></div></div><div class="wrap">`;
  if(D.intro)o+=`<section class="md">${tag(t(D.intro))}</section>`;
  if(D.summary||D.stats?.length){o+=`<section><h2>${u.summary}</h2>`;if(D.summary)o+=`<p class="lead">${esc(t(D.summary))}</p>`;
    if(D.stats?.length)o+=`<div class="stats" aria-label="${u.numbers}">${D.stats.map(s=>`<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(t(s.label))}</div></div>`).join('')}</div>`;o+='</section>'}
  if(D.charts?.length){o+=`<section><h2>${u.charts}</h2>`+D.charts.map(c=>`<div class="chart"><h3>${esc(t(c.title))}</h3>${chart(c)}${t(c.note)?`<p class="note">${esc(t(c.note))}</p>`:''}</div>`).join('')+'</section>'}
  if(D.tables?.length){o+=`<section><h2>${u.tables}</h2>`+D.tables.map(tb=>{const num=tb.rows.length?tb.rows[0].map((_,j)=>tb.rows.every(r=>!isNaN(parseFloat(r[j]))&&j>0)):[];
    return `<h3>${esc(t(tb.title))}</h3><div class="tscroll"><table><thead><tr>${tb.columns.map((c,j)=>`<th class="${num[j]?'num':''}">${esc(t(c))}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${r.map((v,j)=>`<td class="${num[j]?'num':''}">${esc(t(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">${u.scroll}${t(tb.note)?' · '+esc(t(tb.note)):''}</p>`}).join('')+'</section>'}
  (D.sections||[]).forEach(s=>{if(s.html){o+=`<section class="md">${tag(t(s.html))}</section>`;return}o+=`<section><h2>${esc(t(s.heading))}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(t(p))}</p>`).join('')}${s.quote?`<blockquote>${esc(t(s.quote))}</blockquote>`:''}</section>`});
  if(D.sources?.length)o+=`<section class="sources"><h2>${u.sources}</h2><ol>${D.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t(s.title))}</a>${t(s.note)?` — <span class="note">${esc(t(s.note))}</span>`:''}</li>`).join('')}</ol></section>`;
  document.getElementById('app').innerHTML=o+'</div>';
  document.querySelector('.toggle').style.display=D.inlineBilingual?'none':'';
  document.title=t(h.title)+' · Bluey Lens 布利觀點';
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('bl-lang',L);history.replaceState(null,'','?lang='+L);render()});
render();
})();
</script>
</body>
</html>
