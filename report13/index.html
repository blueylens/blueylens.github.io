    "zh": "<h2>0. 來源影片 / Source videos<\/h2>\n<p>Both videos are from <strong>Asianometry<\/strong> (channel <code>UC1LpsuAUaKoMzzJSEt5WImw<\/code>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/channel/UC1LpsuAUaKoMzzJSEt5WImw),\">https://www.youtube.com/channel/UC1LpsuAUaKoMzzJSEt5WImw),<\/a> by Jon Y. X: <strong>@asianometry<\/strong>.<\/p>\n<ol>\n<li><em>Did Numerical Control De-skill Machinists? | Asianometry<\/em>, uploaded 2026-09-10, <a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/DNKfD1PC68E\">https://youtu.be/DNKfD1PC68E<\/a><\/li>\n<li><em>The Birth &amp; Rise of India's IT Outsourcing Industry | Asianometry<\/em>, uploaded 2026-10-18, <a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/NYej-KstgTg\">https://youtu.be/NYej-KstgTg<\/a> (co-authored with Zoso/Felix of the Zoso Project, per the video)<\/li>\n<\/ol>\n<p>These two episodes go well together. One asks what automation did to the most prestigious blue-collar trade. The other traces how India built the largest knowledge-work export machine of the past 50 years. 兩集合看，剛好是一條從工廠到辦公室的自動化時間線。<\/p>\n<hr />",
    "en": "<h2>0. 來源影片 / Source videos<\/h2>\n<p>Both videos are from <strong>Asianometry<\/strong> (channel <code>UC1LpsuAUaKoMzzJSEt5WImw<\/code>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/channel/UC1LpsuAUaKoMzzJSEt5WImw),\">https://www.youtube.com/channel/UC1LpsuAUaKoMzzJSEt5WImw),<\/a> by Jon Y. X: <strong>@asianometry<\/strong>.<\/p>\n<ol>\n<li><em>Did Numerical Control De-skill Machinists? | Asianometry<\/em>, uploaded 2026-09-10, <a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/DNKfD1PC68E\">https://youtu.be/DNKfD1PC68E<\/a><\/li>\n<li><em>The Birth &amp; Rise of India's IT Outsourcing Industry | Asianometry<\/em>, uploaded 2026-10-18, <a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/NYej-KstgTg\">https://youtu.be/NYej-KstgTg<\/a> (co-authored with Zoso/Felix of the Zoso Project, per the video)<\/li>\n<\/ol>\n<p>These two episodes go well together. One asks what automation did to the most prestigious blue-collar trade. The other traces how India built the largest knowledge-work export machine of the past 50 years. 兩集合看，剛好是一條從工廠到辦公室的自動化時間線。<\/p>\n<hr />"

    "zh": "<h2>1. 摘要 / Summary<\/h2>\n<p><strong>中文<\/strong><\/p>\n<ul>\n<li><strong>[影片]<\/strong> Asianometry 認為，數值控制（NC/CNC）讓工具機技師的工作「重組」了技能，整體技能水準大致持平：引用 Keefe（1991）分析三份 BLS 調查，30 年間技能水準僅下降約 1%，底下的職務組成卻大幅洗牌。<\/li>\n<li><strong>[影片]<\/strong> 印度 IT 出口業早期靠「移植程式（porting）」與跨時區 24 小時開發起家；影片指出，Claude 等 AI 早期做得最好的工作，正好就是這些。<\/li>\n<li><strong>[事實]<\/strong> 2026 年 9 月底，TCS 員工 598,056 人，比 2025 年 6 月底高峰 613,069 人少 15,013 人；9 月季度美元營收年增 2.4%。<\/li>\n<li><strong>[事實]<\/strong> Infosys 員工 332,542 人，一年只多 551 人；FY27 營收成長指引為固定匯率 1%–2%。Wipro 一年多 836 人，Q3 指引 -1.5% 至 +0.5%。<\/li>\n<li><strong>[事實]<\/strong> Accenture 一年員工增加 35,118 人（+4.5%），營收 +6%（美元，含 17 件收購）。<\/li>\n<li><strong>[事實]<\/strong> 美國勞工統計局（BLS）預估 2025–35 年「電腦程式設計師」就業 -7%，「工具機技師與模具師」合計 -1%（其中模具師 -9%）。<\/li>\n<li><strong>[觀點]<\/strong> 兩支影片的結尾都指向「監督」這一層：NC 之後技師留下的是監督機器的能力，印度 IT 客戶仍付錢買「整合、治理與信任」。印度 IT 大廠正以整個產業的規模嘗試這場渡河，速度遠快於 NC。（以公司比擬個別工人屬類比。）<\/li>\n<\/ul>\n<p><strong>English<\/strong><\/p>\n<ul>\n<li><strong>[Video]<\/strong> Asianometry argues NC/CNC reshaped machinists' skills and kept the trade alive. Citing Keefe (1991), three BLS surveys over 30 years showed aggregate skill levels down only ~1%, with heavy churn in job composition underneath.<\/li>\n<li><strong>[Video]<\/strong> India's IT exporters grew up on porting code and round-the-clock, cross-time-zone development. The video notes these are exactly the jobs early AI coding agents such as Claude do well.<\/li>\n<li><strong>[Fact]<\/strong> TCS had 598,056 employees at end-Sep 2026, 15,013 below the June 2025 peak of 613,069; USD revenue +2.4% YoY in the September quarter.<\/li>\n<li><strong>[Fact]<\/strong> Infosys: 332,542 employees, +551 in a year; FY27 guidance 1%–2% constant currency. Wipro: +836 in a year; Q3 guide -1.5% to +0.5%.<\/li>\n<li><strong>[Fact]<\/strong> Accenture added 35,118 people in FY26 (+4.5%) on +6% USD revenue (including 17 acquisitions).<\/li>\n<li><strong>[Fact]<\/strong> BLS projects US computer programmer employment -7% over 2025–35; machinists and tool &amp; die makers combined -1% (tool &amp; die makers -9%).<\/li>\n<li><strong>[Opinion]<\/strong> Both videos end at the supervision layer: after NC the machinist's lasting skill was supervising the machine; Indian IT clients still pay for \"integration, governance, and trust.\" India's IT giants are attempting that crossover at industry scale and far faster. (Firm-to-worker comparison is an analogy.)<\/li>\n<\/ul>\n<hr />",
    "en": "<h2>1. 摘要 / Summary<\/h2>\n<p><strong>中文<\/strong><\/p>\n<ul>\n<li><strong>[影片]<\/strong> Asianometry 認為，數值控制（NC/CNC）讓工具機技師的工作「重組」了技能，整體技能水準大致持平：引用 Keefe（1991）分析三份 BLS 調查，30 年間技能水準僅下降約 1%，底下的職務組成卻大幅洗牌。<\/li>\n<li><strong>[影片]<\/strong> 印度 IT 出口業早期靠「移植程式（porting）」與跨時區 24 小時開發起家；影片指出，Claude 等 AI 早期做得最好的工作，正好就是這些。<\/li>\n<li><strong>[事實]<\/strong> 2026 年 9 月底，TCS 員工 598,056 人，比 2025 年 6 月底高峰 613,069 人少 15,013 人；9 月季度美元營收年增 2.4%。<\/li>\n<li><strong>[事實]<\/strong> Infosys 員工 332,542 人，一年只多 551 人；FY27 營收成長指引為固定匯率 1%–2%。Wipro 一年多 836 人，Q3 指引 -1.5% 至 +0.5%。<\/li>\n<li><strong>[事實]<\/strong> Accenture 一年員工增加 35,118 人（+4.5%），營收 +6%（美元，含 17 件收購）。<\/li>\n<li><strong>[事實]<\/strong> 美國勞工統計局（BLS）預估 2025–35 年「電腦程式設計師」就業 -7%，「工具機技師與模具師」合計 -1%（其中模具師 -9%）。<\/li>\n<li><strong>[觀點]<\/strong> 兩支影片的結尾都指向「監督」這一層：NC 之後技師留下的是監督機器的能力，印度 IT 客戶仍付錢買「整合、治理與信任」。印度 IT 大廠正以整個產業的規模嘗試這場渡河，速度遠快於 NC。（以公司比擬個別工人屬類比。）<\/li>\n<\/ul>\n<p><strong>English<\/strong><\/p>\n<ul>\n<li><strong>[Video]<\/strong> Asianometry argues NC/CNC reshaped machinists' skills and kept the trade alive. Citing Keefe (1991), three BLS surveys over 30 years showed aggregate skill levels down only ~1%, with heavy churn in job composition underneath.<\/li>\n<li><strong>[Video]<\/strong> India's IT exporters grew up on porting code and round-the-clock, cross-time-zone development. The video notes these are exactly the jobs early AI coding agents such as Claude do well.<\/li>\n<li><strong>[Fact]<\/strong> TCS had 598,056 employees at end-Sep 2026, 15,013 below the June 2025 peak of 613,069; USD revenue +2.4% YoY in the September quarter.<\/li>\n<li><strong>[Fact]<\/strong> Infosys: 332,542 employees, +551 in a year; FY27 guidance 1%–2% constant currency. Wipro: +836 in a year; Q3 guide -1.5% to +0.5%.<\/li>\n<li><strong>[Fact]<\/strong> Accenture added 35,118 people in FY26 (+4.5%) on +6% USD revenue (including 17 acquisitions).<\/li>\n<li><strong>[Fact]<\/strong> BLS projects US computer programmer employment -7% over 2025–35; machinists and tool &amp; die makers combined -1% (tool &amp; die makers -9%).<\/li>\n<li><strong>[Opinion]<\/strong> Both videos end at the supervision layer: after NC the machinist's lasting skill was supervising the machine; Indian IT clients still pay for \"integration, governance, and trust.\" India's IT giants are attempting that crossover at industry scale and far faster. (Firm-to-worker comparison is an analogy.)<\/li>\n<\/ul>\n<hr />"

    "zh": "<h2>2. 影片重點 / What the videos claim (attributed to Asianometry)<\/h2>\n<h3>2.1 <em>Did Numerical Control De-skill Machinists?<\/em><\/h3>\n<ul>\n<li>Machining was \"the single largest group of skilled manufacturing jobs for American men\" in the first half of the 20th century; apprenticeships ran ~4 years / 8,000 hours. <strong>[Video]<\/strong><\/li>\n<li>Early NC (1950s–60s) disappointed owners who hoped to down-skill: hard-wired, inflexible, top staff assigned to it. <strong>[Video]<\/strong><\/li>\n<li>Productivity: one NC drilling machine estimated to replace three conventional machines; a 1982 Swedish study cites one firm needing 22 NC operators where it once needed 44 lathe operators, another replacing 63 operators with 21. NC operator training: 6–12 months versus 4–5 years. <strong>[Video]<\/strong><\/li>\n<li>A 1980s Canadian survey: ~80% of manual machinists said NC needs \"less skill\"; those who had run NC split about half-half. <strong>[Video]<\/strong><\/li>\n<li>Wages (1989 study of 1981 BLS data): Class A machinists $9.72/hr, NC operators $9.51/hr; Class B/C $8.54/$6.41. <strong>[Video]<\/strong><\/li>\n<li>CNC with keyboard/screen input handed some programming power back to the shop floor. Machinist Bill Bowman earned ~$30k in 1989 from CNC-enriched work; after layoffs his pay fell to ~$20k a year (~$9/hr). <strong>[Video]<\/strong><\/li>\n<li>A mid-1990s survey of <strong>Taiwanese CNC operators<\/strong> found 80% had both machining and programming experience. <strong>[Video]<\/strong><\/li>\n<li>Keefe (1991): skill levels across three BLS surveys over 30 years declined ~1% in aggregate. <strong>[Video]<\/strong><\/li>\n<li>Parallel drawn: AI coding moved from autocomplete (Copilot, early Cursor) to agents; programmers may follow the machinist's path, with the same judgment expressed through a new interface. Takeaway: keep learning. <strong>[Video]<\/strong><\/li>\n<\/ul>\n<h3>2.2 <em>The Birth &amp; Rise of India's IT Outsourcing Industry<\/em><\/h3>\n<ul>\n<li>TCS began as Tata's in-house data unit (1968); porting was 20–40% of early Indian IT business; onsite \"body shopping\" was 75–80% of export earnings into the late 1980s, falling to 59% by the late 1990s after Software Technology Parks brought satellite links. <strong>[Video]<\/strong><\/li>\n<li>Software exports: $3.5M (1980) → $96M (1990); Y2K earned ~$2.3B for Indian software in the late 1990s. <strong>[Video]<\/strong><\/li>\n<li>India IT exports: $9.5B (2003) → ~$76B (2013) → $194B (2023); sector ~6M direct jobs, 7–8% of GDP. <strong>[Video]<\/strong><\/li>\n<li>Per Nasscom (as cited): industry added ~300,000 jobs in 2023 and ~60,000 in 2024; growth slowed from 8.4% to 3.8%. <strong>[Video]<\/strong><\/li>\n<li>TCS laid off ~2% / ~12,000 in July 2025; Infosys and TCS shares fell ~40% since Dec 2024 (as of recording). <strong>[Video]<\/strong><\/li>\n<li>Anthropic's early-2026 Claude plugins for legal, finance and sales hit SaaS stocks and Infosys/TCS. The IT firms say GenAI will enhance their work; enterprises still need integration, governance and trust. <strong>[Video]<\/strong><\/li>\n<\/ul>\n<hr />",

try<\/em><\/h3>\n<ul>\n<li>TCS began as Tata's in-house data unit (1968); porting was 20–40% of early Indian IT business; onsite \"body shopping\" was 75–80% of export earnings into the late 1980s, falling to 59% by the late 1990s after Software Technology Parks brought satellite links. <strong>[Video]<\/strong><\/li>\n<li>Software exports: $3.5M (1980) → $96M (1990); Y2K earned ~$2.3B for Indian software in the late 1990s. <strong>[Video]<\/strong><\/li>\n<li>India IT exports: $9.5B (2003) → ~$76B (2013) → $194B (2023); sector ~6M direct jobs, 7–8% of GDP. <strong>[Video]<\/strong><\/li>\n<li>Per Nasscom (as cited): industry added ~300,000 jobs in 2023 and ~60,000 in 2024; growth slowed from 8.4% to 3.8%. <strong>[Video]<\/strong><\/li>\n<li>TCS laid off ~2% / ~12,000 in July 2025; Infosys and TCS shares fell ~40% since Dec 2024 (as of recording). <strong>[Video]<\/strong><\/li>\n<li>Anthropic's early-2026 Claude plugins for legal, finance and sales hit SaaS stocks and Infosys/TCS. The IT firms say GenAI will enhance their work; enterprises still need integration, governance and trust. <strong>[Video]<\/strong><\/li>\n<\/ul>\n<hr />"

"https://www.infosys.com/investors/reports-filings/quarterly-results/2026-2027/q2/documents/ifrs-inr-press-release.pdf\">Infosys Q2 FY27 press release<\/a><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Wipro headcount Q2 FY27 / Q1 FY27 / Q2 FY26<\/td>\n<td>236,328 / 243,044 / 235,492<\/td>\n<td>Fact<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.wipro.com/content/dam/nexus/en/investor/quarterly-results/2026-2027/q2fy27/datasheet-q2fy27.pdf\">Wipro Q2 FY27 datasheet<\/a><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Wipro Q3 FY27 guidance<\/td>\n<td>-1.5% to +0.5% QoQ CC<\/td>\n<td>Fact<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.wipro.com/content/dam/nexus/en/investor/quarterly-results/2026-2027/q2fy27/press-release-q2fy27.pdf\">Wipro Q2 FY27 release<\/a><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>HCLTech headcount Sep-26 / Sep-25<\/td>\n<td>230,339 / 226,640 (+3,699, +1.6%)<\/td>\n<td>Fact / Estimate<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.hcltech.com/sites/default/files/document/open/quarter-results/2026-10/hcltech-Q2-fy27-Investor-release.pdf\">HCLTech Q2 FY27 investor release<\/a><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>HCLTech revenue per employee<\/td>\n<td>$65.4K (LTM)<\/td>\n<td>Fact<\/td>\n<td>same<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Accenture employees 8/31/26 vs 8/31/25<\/td>\n<td>814,391 vs 779,273 (+35,118, +4.5%)<\/td>\n<td>Fact / Estimate<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://investor.accenture.com/~/media/Files/A/accenture-v4/investors/earnings-reports/2026/accentures-fourth-quarter-fiscal-2026-earnings-presentation.pdf\">ACN Q4 FY26 presentation<\/a><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Accenture FY26 revenue<\/td>\n<td>$74.2B, +6% USD; 17 acquisitions<\/td>\n<td>Fact<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://newsroom.accenture.com/content/4q-full-fy26-earnings/accenture-reports-fourth-quarter-and-full-year-fiscal-2026-results.pdf\">ACN Q4 FY26 release<\/a><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Cognizant headcount 6/30/26<\/td>\n<td>356,700 (-900 QoQ, +12,900 YoY); Q3 due Oct 29<\/td>\n<td>Fact<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://investors.cognizant.com/news-and-events/news/news-details/2026/Cognizant-Reports-Second-Quarter-2026-Results/default.aspx\">CTSH Q2 2026 release<\/a><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>US machinists + tool &amp; die makers<\/td>\n<td>344,900 (2025) → 342,700 (2035), -1%; T&amp;D -9%<\/td>\n<td>Fact (projection)<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bls.gov/ooh/production/machinists-and-tool-and-die-makers.htm\">BLS OOH<\/a><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>US computer programmers<\/td>\n<td>110,800 → 102,700, -7%<\/td>\n<td>Fact (projection)<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bls.gov/ooh/computer-and-information-technology/computer-programmers.htm\">BLS OOH<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3.2 解讀 / Reading the numbers<\/h3>\n<p><strong>營收與人數脫鉤 / Revenue and headcount are decoupling.<\/strong> <strong>[Estimate]<\/strong> TCS grew USD revenue 2.4% YoY on +0.8% headcount, and still sits 15,013 below its mid-2025 peak. Infosys grew 1.5% CC on +0.2% headcount. Wipro's IT services revenue rose 0.3% YoY with headcount +0.4%. The Indian majors are holding revenue roughly flat to slightly up with roughly flat people. For an industry that for decades grew revenue by adding people, that is the structural break.<\/p>\n<p><strong>[觀點 Opinion]<\/strong> Asianometry's machinist episode gives the frame. After NC, shops needed fewer operators per machine (22 versus 44, 21 versus 63 in the Swedish cases), and the work that remained shifted toward programming and system supervision. In Indian IT, the \"operator\" tier is the fresher-heavy delivery pyramid, and AI coding agents sit where the NC controller sat. The firms are still hiring freshers (Infosys targets ~20,000 in FY27; HCLTech added 6,136 in Q2), so the pyramid is narrowing gradually.<\/p>\n<p><strong>Accenture 是例外嗎？/ Is Accenture the outlier?<\/strong> <strong>[Fact]<\/strong> Accenture added 35,118 people and grew revenue 6% in USD. <strong>[Opinion]<\/strong> Much of that is acquisitions ($4.9B across 17 deals in FY26), which buys headcount and capability at once. It shows one exit route from the pyramid: buy consulting and domain depth that sells on outcomes.<\/p>\n<p><strong>BLS 投影 / The BLS projections.<\/strong> <strong>[Fact]<\/strong> BLS expects programmer jobs to fall 7% by 2035 and explicitly cites AI automating repetitive programming tasks, with higher-skill tasks shifting to software developers. Machinists are projected +1% while tool &amp; die makers fall 9%, which BLS ties to CNC and automation. <strong>[Opinion]<\/strong> Sixty years after NC, the trade still exists, smaller at the edges and more technical in the middle. That is the base case we would draw for programmers too.<\/p>\n<h3>3.3 渡河：從執行到監督 / The crossover: from doing to supervising (v4 framing)<\/h3>\n<p><strong>[Video]<\/strong> The India video closes (~30:11–31:16): early Claude jobs resemble the IT exporters' work (\"Porting software, 24-hour development cycles... and other knowledge work\"); \"Enterprise customers still need integration, governance, and trust\"; savings \"can be passed to the client and additional margins to be kept\"; the firms face \"a crossover\" through a \"fast-flowing river\". <strong>[Video]<\/strong> The NC video closes on system supervision (16:27), \"a team of agents monitored and steered by humans\" (~19:58), and \"The NC operator of the AI coding era\" (~20:37).<\/p>\n<p><strong>[觀點 Opinion]<\/strong> Both endings point at the supervision layer. Caveats: comparing whole firms with individual workers is an analogy; NC took decades, and this transition is moving faster.<\/p>\n<ol>\n<li><strong>能為監督收費嗎 / Can they charge for supervision?<\/strong> <strong>[Fact]<\/strong> TCS and Infosys put AI-linked work at roughly a tenth of revenue, by their own definitions (TCS annualized run-rate; Infosys share of quarterly revenue). <strong>[Opinion]<\/strong> Some demand for the new layer is showing up. Supervision prices naturally on outcomes; the test is the fixed-price/outcome share.<\/li>\n<li><strong>紅利歸誰 / Who keeps the gain?<\/strong> <strong>[Video]<\/strong> Bowman: \"In 1989, he says he earned about $30,000 a year for this type of CNC-enriched work\" (~14:44); \"as more people learned the skills he did, his CNC wage boost compressed. Several years and layoffs later, he was pulling down $20,000 a year or about $9 an hour despite doing more CNC programming work\" (~15:59–16:12). <strong>[Fact]<\/strong> TCS USD revenue +2.4% YoY in the Sep 2026 quarter (Q2 FY27); Infosys guided to 1–2% FY27 CC; Wipro Dec-quarter guide -1.5% to +0.5%. <strong>[Opinion]<\/strong> Our read: the thin growth so far, alongside flat headcount, suggests clients are capturing much of the gain.<\/li>\n<li><strong>金字塔縮多少 / How far does the pyramid narrow?<\/strong> <strong>[Fact]<\/strong> TCS 598,056 at end-Sep 2026, 15,013 below the end-Jun 2025 peak; Infosys 332,542 (+551 YoY); Wipro +836 YoY. <strong>[Video]<\/strong> Keefe (1991): aggregate skill ~-1% over 30 years, \"a lot of turbulence underneath\" (~19:25). <strong>[Fact]<\/strong> BLS 2025–2035: machinists +1%, programmers -7% (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.bls.gov/emp/,\">https://www.bls.gov/emp/,<\/a> OOH pages last modified 2026-08-27; re-verified 2026-10-27).<\/li>\n<\/ol>",

<style>
:root{color-scheme:dark;--bg:#0B0C0E;--card:#15181D;--card2:#1B1F25;--line:#2A2F37;--ink:#ECEEF1;--text:#D5D9DE;--mute:#9AA3AE;
--blue:#2563EB;--link:#7CB2FF;--tint:rgba(37,99,235,.14);
--lat:"Space Grotesk",system-ui,sans-serif;--tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--lat),var(--tc);font-size:17px;line-height:1.75}
html[lang=zh-Hant] body{font-family:var(--tc)}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1px}a:hover{color:#A9CBFF}
::selection{background:var(--blue);color:#fff}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.bar{position:sticky;top:0;z-index:10;background:rgba(11,12,14,.82);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--lat);font-weight:700;color:var(--ink);text-decoration:none;font-size:15px}
.mark{width:26px;height:26px;flex:none}
.toggle{display:flex;border:1px solid var(--line);background:var(--card);border-radius:999px;overflow:hidden;padding:3px}
.toggle button{all:unset;cursor:pointer;padding:3px 13px;border-radius:999px;font:700 14px var(--lat);color:var(--mute);min-width:24px;text-align:center}
.toggle button[aria-pressed=true]{background:var(--ink);color:#0B0C0E}
.toggle button:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(37,99,235,.20),transparent 55%),var(--bg);color:var(--ink);padding:52px 0 44px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .big{position:absolute;right:-50px;top:-50px;width:150px;height:150px}
.kicker{position:relative;padding-right:96px;font:700 12.5px var(--lat);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
html[lang=zh-Hant] .kicker{letter-spacing:.08em}
h1{font-weight:900;font-size:clamp(28px,7.4vw,54px);line-height:1.2;margin:14px 0 12px;max-width:20ch;position:relative;color:#fff;letter-spacing:-.01em}
.sub{font-size:19px;color:var(--text);margin:0 0 20px;max-width:34ch;position:relative}
.date{font:500 14px var(--lat);color:var(--mute)}
.rule{display:block;width:48px;height:4px;border-radius:2px;background:var(--blue);margin:22px 0 0}
section{padding:40px 0 4px}
h2{font-size:25px;line-height:1.3;margin:0 0 18px;font-weight:900;color:var(--ink)}
h2::before{content:"";display:block;width:28px;height:4px;border-radius:2px;background:var(--blue);margin-bottom:14px}
h3{font-size:18px;margin:26px 0 12px;color:var(--ink)}
p{margin:0 0 1em}strong{color:var(--ink)}
.lead{font-size:18px;color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .v{font:700 clamp(30px,8vw,44px)/1.05 var(--lat);letter-spacing:-.02em;color:#fff}
.stat:first-child{background:linear-gradient(160deg,rgba(37,99,235,.28),rgba(37,99,235,.08));border-color:rgba(96,165,250,.45)}
.stat .l{font-size:14px;line-height:1.5;margin-top:8px;color:var(--mute)}
.chart{margin:8px 0 26px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px}
.chart h3{margin-top:0}
.chart svg{width:100%;max-width:600px;height:auto;display:block}
.note{font-size:14px;color:var(--mute);line-height:1.6}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 1em}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:480px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card2);color:var(--ink);font-weight:700}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
td.num,th.num{text-align:right;font-family:var(--lat);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
blockquote{margin:24px 0;padding:12px 16px;border-left:3px solid var(--blue);background:var(--card);border-radius:0 10px 10px 0;font-size:18px;font-weight:700;color:var(--ink)}
.sources ol{padding-left:22px}.sources li{margin:8px 0;word-break:break-word}
.md h2{margin-top:12px}.md table{min-width:0;white-space:normal;font-size:14px}.md th,.md td{padding:9px 10px;white-space:normal;vertical-align:top}
.md ul,.md ol{padding-left:22px}.md li{margin:6px 0}.md li::marker{color:var(--mute)}.md code{font-size:.9em;background:var(--card2);padding:1px 5px;border-radius:5px}
.md blockquote{font-weight:500;font-size:17px;color:var(--text)}
.md .disclaimer{background:rgba(37,99,235,.10);border:1px solid rgba(96,165,250,.40);border-left:4px solid var(--blue);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15.5px;color:var(--ink);margin:18px 0}
.md .disclaimer p{margin:0}
.md a{overflow-wrap:anywhere}.md hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.tag{display:inline-block;font:700 11.5px/1.5 var(--lat);letter-spacing:.04em;padding:0 7px;border-radius:5px;border:1px solid;vertical-align:1px;white-space:nowrap}
.tag-fact{color:#86EFAC;border-color:rgba(134,239,172,.45);background:rgba(34,197,94,.10)}
.tag-opinion{color:#93C5FD;border-color:rgba(147,197,253,.45);background:rgba(37,99,235,.14)}
.tag-rumor,.tag-reported{color:#FCD34D;border-color:rgba(252,211,77,.45);background:rgba(245,158,11,.10)}
.tag-inference,.tag-estimate{color:#C4B5FD;border-color:rgba(196,181,253,.45);background:rgba(139,92,246,.12)}
footer{margin-top:56px;background:#070809;border-top:1px solid var(--line);color:var(--mute);padding:32px 0;font-size:15px}
footer a{color:var(--ink);text-decoration:none;font-weight:700}footer .brand{color:var(--ink)}
@media(min-width:720px){h1{max-width:15em}.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:84px 0 68px}.hero .big{right:-70px;top:-70px;width:280px;height:280px}body{font-size:18px}}
@media(prefers-reduced-motion:no-preference){.bar-fill{transition:width .6s}}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><symbol id="lens" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="currentColor"/><circle cx="50" cy="50" r="32.5" fill="var(--bg,#fff)"/><circle cx="50" cy="50" r="15.3" fill="#2563EB"/></symbol></svg>
<header class="bar"><div class="wrap">

</div></header>
<main id="app"></main>
<footer><div class="wrap">
  <a class="brand" href="https://x.com/BlueyLensTW" target="_blank" rel="noopener"><svg class="mark" style="color:#ECEEF1;--bg:#070809"><use href="#lens"/></svg>Bluey Lens 布利觀點 · @BlueyLensTW</a>
  <p style="margin:10px 0 0" data-t="tagline"></p>
</div></footer>
<script>
(function(){
const D=JSON.parse(document.getElementById('report-data').textContent);
const UI={zh:{summary:'重點摘要',numbers:'關鍵數字',charts:'圖表',tables:'數據表',sources:'資料來源',tagline:'從台北看矽谷',scroll:'表格可左右滑動',updated:'發布日期'},
          en:{summary:'Key takeaways',numbers:'Key numbers',charts:'Charts',tables:'Data tables',sources:'Sources',tagline:'Silicon Valley, seen from Taipei',scroll:'Scroll sideways to see all columns',updated:'Published'}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('bl-lang')||'zh';
const t=o=>o==null?'':(typeof o==='string'||typeof o==='number')?o:(o[L]||o.zh||o.en||'');
const tag=h=>String(h).replace(/\[(FACT|OPINION|RUMOR|REPORTED|INFERENCE|ESTIMATE)\]/g,(m,k)=>`<span class="tag tag-${k.toLowerCase()}">${m}</span>`);
function chart(c){
  const d=c.data,max=Math.max(...d.map(x=>x.value))||1,unit=c.unit||'';
  if(c.type==='line'){
    const W=640,H=300,p={l:40,r:16,t:20,b:36},iw=W-p.l-p.r,ih=H-p.t-p.b;
    const pts=d.map((x,i)=>[p.l+(d.length>1?i*iw/(d.length-1):iw/2),p.t+ih-(x.value/max)*ih]);
    const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
    for(let g=0;g<=4;g++){const y=p.t+ih*g/4;s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#2A2F37"/><text x="${p.l-8}" y="${y+5}" text-anchor="end" font-size="20" fill="#9AA3AE" font-family="Space Grotesk">${+(max*(1-g/4)).toFixed(1)}</text>`}
    s+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#ECEEF1" stroke-width="4" stroke-linejoin="round"/>`;
    pts.forEach((q,i)=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${i===hi?9:5}" fill="${i===hi?'#2563EB':'#ECEEF1'}"/><text x="${q[0]}" y="${H-10}" text-anchor="middle" font-size="20" fill="#D5D9DE" font-family="Space Grotesk, Noto Sans TC">${esc(t(d[i].label))}</text>`});
    return s+'</svg>';
  }
  const rh=78,W=640,H=d.length*rh;const hi=d.reduce((m,x,i)=>x.value>d[m].value?i:m,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.title))}">`;
  d.forEach((x,i)=>{const y=i*rh,w=Math.max(4,(x.value/max)*(W-110));
    s+=`<text x="0" y="${y+26}" font-size="24" fill="#D5D9DE" font-family="Noto Sans TC, Space Grotesk">${esc(t(x.label))}</text>
    <rect x="0" y="${y+38}" width="${W-110}" height="22" rx="11" fill="#232830"/>
    <rect class="bar-fill" x="0" y="${y+38}" width="${w}" height="22" rx="11" fill="${i===hi?'#2563EB':'#8B95A3'}"/>
    <text x="${W}" y="${y+57}" text-anchor="end" font-size="24" font-weight="700" fill="#ECEEF1" font-family="Space Grotesk">${esc(typeof x.value==='number'?x.value.toLocaleString('en-US'):x.value)}${esc(unit)}</text>`});
  return s+'</svg>';
}
function render(){
  document.documentElement.lang=L==='zh'?'zh-Hant':'en';
  document.querySelectorAll('.toggle button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.querySelector('[data-t=tagline]').textContent=UI[L].tagline;
  const u=D.inlineBilingual?Object.fromEntries(Object.keys(UI.en).map(k=>[k,UI.en[k]+' '+UI.zh[k]])):UI[L],h=D.hero;let o='';
  o+=`<div class="hero"><svg class="big" style="color:#ECEEF1;--bg:#0B0C0E"><use href="#lens"/></svg><div class="wrap">
    <div class="kicker">${esc(t(h.kicker))}</div><h1>${esc(t(h.title))}</h1><p class="sub">${esc(t(h.subtitle))}</p>
    <div class="date">${u.updated} · ${esc(h.date)}</div><span class="rule"></span></div></div><div class="wrap">`;
  if(D.intro)o+=`<section class="md">${tag(t(D.intro))}</section>`;
  if(D.summary||D.stats?.length){o+=`<section><h2>${u.summary}</h2>`;if(D.summary)o+=`<p class="lead">${esc(t(D.summary))}</p>`;
    if(D.stats?.length)o+=`<div class="stats" aria-label="${u.numbers}">${D.stats.map(s=>`<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(t(s.label))}</div></div>`).join('')}</div>`;o+='</section>'}
  if(D.charts?.length){o+=`<section><h2>${u.charts}</h2>`+D.charts.map(c=>`<div class="chart"><h3>${esc(t(c.title))}</h3>${chart(c)}${t(c.note)?`<p class="note">${esc(t(c.note))}</p>`:''}</div>`).join('')+'</section>'}
  if(D.tables?.length){o+=`<section><h2>${u.tables}</h2>`+D.tables.map(tb=>{const num=tb.rows.length?tb.rows[0].map((_,j)=>tb.rows.every(r=>!isNaN(parseFloat(r[j]))&&j>0)):[];
    return `<h3>${esc(t(tb.title))}</h3><div class="tscroll"><table><thead><tr>${tb.columns.map((c,j)=>`<th class="${num[j]?'num':''}">${esc(t(c))}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${r.map((v,j)=>`<td class="${num[j]?'num':''}">${esc(t(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">${u.scroll}${t(tb.note)?' · '+esc(t(tb.note)):''}</p>`}).join('')+'</section>'}
  (D.sections||[]).forEach(s=>{if(s.html){o+=`<section class="md">${tag(t(s.html))}</section>`;return}o+=`<section><h2>${esc(t(s.heading))}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(t(p))}</p>`).join('')}${s.quote?`<blockquote>${esc(t(s.quote))}</blockquote>`:''}</section>`});
  if(D.sources?.length)o+=`<section class="sources"><h2>${u.sources}</h2><ol>${D.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t(s.title))}</a>${t(s.note)?` — <span class="note">${esc(t(s.note))}</span>`:''}</li>`).join('')}</ol></section>`;
  document.getElementById('app').innerHTML=o+'</div>';
  document.querySelector('.toggle').style.display=D.inlineBilingual?'none':'';
  document.title=t(h.title)+' · Bluey Lens 布利觀點';
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('bl-lang',L);history.replaceState(null,'','?lang='+L);render()});
render();
})();
</script>
